<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // in JS after running a js file there will be two phases
        // 1.Memorization phase
        // 2.Execution phase
        function hoisting(){
            var a                  //in execution phase this is already memorized so the next line console will be executed
            console.log(a);     //then this line will be executed which is "undefined" 
            var a=5            //here the var a is memorized first in memorization phase
        }
        hoisting()
    </script>   
</body>
</html>
