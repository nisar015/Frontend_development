        function getOrderMessage(stat) {
            var stats = orders.find(function(val){
                return val.id===stat
            })

                return "Order is on the way ";
            }
            else if (stats.status === "pending") {
                return "Order is being processed"
            }
            else if (stats.status === "delivered") {
                return "Order is successfully delivered"
            }
            else if(stats.status ==="cancelled"){
                return "Order cancelled";
            }
        }
