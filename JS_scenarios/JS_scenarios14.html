<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // how to retrieve else category===Laptop
        function findByCategory(pro_cat){
            for(var i=0;i<pro_cat.length;i++){
                if(pro_cat[i].category==="Mobile"){
                    return [pro_cat[i].name,pro_cat[i].price]
                }
                else{
                    return [pro_cat[i].name,pro_cat[i].price]
                }
            }
        }
        // here only prop is iterating
        function findByPriceRange(pro_price,a,b){
            for(var i of pro_price){
                if(i.price>=a && i.price<=b){
                    return i.price
                }
            }
        }
        function findProductByName(pro_name){
            for(var j of pro_name){
                if(j.name==="iPhone"){
                    return j.category
                }
                if(j.name==="Samsung"){
                    return j.category
                }
            }
        }
        var pro_search = [
            { name: "iPhone", category: "Mobile", price: 80000 },
            { name: "Samsung", category: "Mobile", price: 60000 },
            { name: "Dell", category: "Laptop", price: 70000 },
            { name: "HP", category: "Laptop", price: 50000 }
        ];
        console.log(findByCategory(pro_search))
        console.log(findByPriceRange(pro_search,50000,70000))
        console.log(findProductByName(pro_search))

    </script>
</body>

</html>
