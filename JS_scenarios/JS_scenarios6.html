<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        var cart = [
            { name: "Laptop", price: 60000, quantity: 1 },
            { name: "Mouse", price: 1500, quantity: 2 },
            { name: "Keyboard", price: 3000, quantity: 1 }
        ];
        cart_tot=0
        for(var i of cart){
            
            item_tot=i.price*i.quantity
            console.log("item's total :",item_tot)
            cart_tot += item_tot
            
        }
        console.log("cart total :",cart_tot)
        discount =cart_tot*0.2
        tot_discount = cart_tot-discount
        console.log("discount :",discount)
        console.log("total amount after discount :",tot_discount)
        </script>
</body>
</html>
