<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        avg=0
        var obj={}
        function calculateAverage(stu){
            for(var i of stu){
                if(i.name==="Arun"){
                    obj["name"]=i.name
                    for(var j of i.marks){
                        avg +=j 
                    }
                }
                
            }
            // console.log(avg)
            obj["average"]=avg/(i.marks.length)
            return obj
        }
        function findHighestMark(stu_high){
            for(var k of stu_high){
                if(k.name==="Arun"){
                    ele=0
                    for(var l=0;l<k.marks.length;l++){
                        if(k.marks[l]>ele){
                            // console.log(k.marks[l])
                            ele=k.marks[l];
                        }
                    }
                }
            }
            obj["highest"]=ele
        }
        var students =
            [
                {
                    name: "Arun",
                    marks: [80, 75, 90, 85]
                },
                {
                    name: "Priya",
                    marks: [60, 70, 65, 72]
                }
            ]
        console.log(calculateAverage(students))
        console.log(findHighestMark(students))
    </script>
</body>

</html>
