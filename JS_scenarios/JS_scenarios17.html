<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        avg=0
        var obj={}
        function calculateAverage(stu){
            for(var i of stu){
                if(i.name==="Arun"){
                    for(var j of i.marks){
                        avg +=j 
                        obj["name"]=i.name
                    }
                }
                
            }
            // console.log(avg)
            obj["average"]=avg/(i.marks.length)
            return obj
        }
        var students =
            [
                {
                    name: "Arun",
                    marks: [80, 75, 90, 85]
                },
                {
                    name: "Priya",
                    marks: [60, 70, 65, 72]
                }
            ]
            console.log(calculateAverage(students))
    </script>
</body>

</html>
