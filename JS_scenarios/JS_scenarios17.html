<body>
    <script>
        avg=0
        var obj={}
        function calculateAverage(stu){
            for(var i of stu){
                if(i.name==="Arun"){
                    obj["name"]=i.name
                    for(var j of i.marks){
                        avg +=j 
                    }
                }
                
            }
            // console.log(avg)
            obj["average"]=avg/(i.marks.length)
            return obj
        }
        function findHighestMark(stu_high){
            for(var k of stu_high){
                if(k.name==="Arun"){
                    ele=0
                    for(var l=0;l<k.marks.length;l++){
                        if(k.marks[l]>ele){
                            // console.log(k.marks[l])
                            ele=k.marks[l];
                        }
                    }
                }
            }
            obj["highest"]=ele
        }
        function findLowestMark(stu_low){
            for(var n of stu_low){
                if(n.name==="Arun"){
                    ele=n.marks[0]
                    for(var m=1;m<n.marks.length;m++){
                        if(n.marks[m]>ele){
                            // console.log(k.marks[l])
                            ele=ele
                        }
                        else{
                            ele=n.marks[m];
                        }
                    }
                }
            }
            obj["lowest"]=ele
        }
        function calculateGrade(stu_grade){
            if(obj.average>90){

            }

                return obj["Grade"]="A";
            }
            else if(obj.average>70){
                return obj["Grade"]="B";
            }
            else if(obj.average>60){
                return obj["Grade"]="C";
            }

            }
            
        }
        var students =
            [

        console.log(calculateAverage(students))
