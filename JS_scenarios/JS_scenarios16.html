<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>     
    <script>
        // how to do cart tot for the item aded in cart
        cart_tot=0
        function validateCart(shopcart){
            for(var i of shopcart){
                // console.log(first)
                if(i.quantity>0 && i.price>0 && i.name !== ""){
                    cart_tot += i.price
                    // console.log(cart_tot)
                }
                // if(i.price ){
                // }
            }
            return cart_tot

        }
        var shopping_cart = [
            { name: "Laptop", price: 60000, quantity: 1 },
            { name: "Mouse", price: 1500, quantity: 0 },
            { name: "Keyboard", price: 3000, quantity: 2 }
        ]
        console.log(validateCart(shopping_cart))
    </script>
</body>

</html>
