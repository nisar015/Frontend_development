<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // how to do cart tot for the item aded in cart
        function getInvalidItems(invalid_item) {
            return  invalid_item + ": Item is invalid";


        }
        function calculateCartTotal(cart_tot,item_val){
            cart_tot += (item_val.price * item_val.quantity)
            console.log(cart_tot)
            return cart_tot
        }
        carttot = 0
        function validateCart(shopcart_name) {
            var item_valid = shopping_cart.find(function (val) {
                return val.name===shopcart_name
            })
            if (item_valid.name === shopcart_name) {
                if (item_valid.quantity > 0 && item_valid.price > 0 && item_valid.name !== "") {
                    console.log(item_valid.name + ": item is valid")
                    return "cart total :"+calculateCartTotal(carttot,item_valid)
                    
                }
                else {
                    return getInvalidItems(shopcart_name)
                    // console.log("item is Invalid");
                }

            }

        }
        var shopping_cart = [
            { name: "Laptop", price: 60000, quantity: 1 },
            { name: "Mouse", price: 1500, quantity: 0 },
            { name: "Keyboard", price: 3000, quantity: 2 }
        ]
        console.log(validateCart('Laptop'))
        console.log(validateCart('Mouse'))
        console.log(validateCart('Keyboard'))
    </script>
</body>

</html>
