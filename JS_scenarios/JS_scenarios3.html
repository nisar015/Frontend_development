<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function apply_discount(totalamount) {
            if (totalamount > 50000) {
                totalamount -= totalamount * 0.2
                return "discount: " + totalamount
            }
            else if (totalamount > 20000) {
                return totalamount -= totalamount * 0.1
            }
            else {
                return totalamount
            }
        }

        var products = [
            { name: "Laptop", price: 60000 },
            { name: "Mouse", price: 1500 },
            { name: "Keyboard", price: 3000 }
        ];
        var tot_amount = products.reduce(function (a, b) {
            // console.log(a)
            return a + b.price
        }, 0)
        console.log( "total amount" +tot_amount)
        console.log(apply_discount(tot_amount))


    </script>
</body>

</html>
