    <script>
        var inventory = [
        { name: "Laptop", stock: 10 },
        { name: "Mouse", stock: 0 },
        { name: "Keyboard", stock: 5 }
    ];
    function checkStock(stocks){
        if(stocks===0){
            return "Out of Stock";
        }

    }
    function getOutOfStockProducts(st){
        return st
    }
    for(var i of inventory){
        console.log(checkStock(i.stock))
        if(i.stock===0){
            console.log(getOutOfStockProducts(i.name))
        }
        
    }
    </script>
