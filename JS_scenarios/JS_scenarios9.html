<body>
    <script>
        function findEmployeeById(Eid){
            if(Eid===employee.id){
                return [employee.name,employee.department]
            }
        }
        var employee = [
            { id: 101, name: "Arun", department: "IT" },
            { id: 102, name: "Priya", department: "HR" },
            { id: 103, name: "John", department: "IT" }
        ];
        for(var i of employee){
            var ans=findEmployeeById(i.id)
            console.log(ans)
        }
    </script>
