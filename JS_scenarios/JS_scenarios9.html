<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function findEmployeeById(iden){
            return employee.filter(function(val){
                return val.id===iden
            })
            
        }
        function findEmployeesByDepartment(department){
            return employee.filter(function(val){
                return val.department===department
            })
        }
        var employee = [
            { id: 101, name: "Arun", department: "IT" },
            { id: 102, name: "Priya", department: "HR" },
            { id: 103, name: "John", department: "IT" }
        ];
        console.log(findEmployeeById(101))
        console.log(findEmployeeById(102))
        console.log(findEmployeeById(103))
        
        console.log(findEmployeesByDepartment('IT'))
        console.log(findEmployeesByDepartment('HR'))
    </script>
</body>

</html>
