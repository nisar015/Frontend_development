<body>
    <script>
        function findEmployeeById(id){
            // if(Eid===employee.id){
            return [id.name,id.department]
            
        }
        function findEmployeesByDepartment(department){
            return [department.id,department.name]
        }
        var employee = [
            { id: 101, name: "Arun", department: "IT" },
            { id: 102, name: "Priya", department: "HR" },
            { id: 103, name: "John", department: "IT" }
        ];
        for(var i of employee){
            // console.log(i.id)
            console.log(findEmployeeById(i))
            console.log(findEmployeesByDepartment(i))
        }
    </script>
</body>
