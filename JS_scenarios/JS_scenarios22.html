    <script>
        function generateReorderList(proname,proquantity){
            Neworderlst.push(proname)
            Neworderlst.push(proquantity)
            // return Neworderlst
        }
        function check_stock(pro_data){
            if(pro_data.stock<=pro_data.reorderLevel){
                generateReorderList(pro_data.name,pro_data.reorderQuantity) 
            }
            return Neworderlst
        }
        var Neworderlst=[]
        var reorder_lst=[
            {
                name: "Laptop",
                stock: 3,
                reorderLevel: 5,
                reorderQuantity: 10
            },
            {
                name: "Mouse",
                stock: 20,
                reorderLevel: 5,
                reorderQuantity: 10
            }
        ]
        reorder_lst.forEach(function(val){
            // console.log(val)
            console.log(check_stock(val))
        })
    </script>
