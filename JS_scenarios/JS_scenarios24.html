<body>
    
    <script>
        function addProduct(pro_name){
            var check= cart.find(function(val){
                return val.product.name===pro_name

            })
            if(check){
                minicart.product=check.product.name
            }
            return minicart
        }
        var cart = [
            {
                product: {
                    id: 1,
                    name: "Laptop",
                    price: 60000
                },
                quantity: 1
            },
            {
                product: {
                    id: 2,
                    name: "Mouse",
                    price: 1500
                },
                quantity: 2
            }
        ];
        var minicart=[]
        console.log(addProduct('Laptop'))
        console.log(addProduct('Mouse'))
        console.log(minicart)
    </script>
