<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        function addProduct(product, quan) {
            // cart.forEach(function (val) {
            //     // console.log(val.quantity)

            // })
            if (quan <= 0) {
                console.log("invalid quantity");
                return
            }
            var checkitem = cart.find(function (val) {
                return val.product.name === product

            })
            if (checkitem) {
                checkitem.quantity += quan;
                console.log(checkitem)
                
            }
            else{
                cart.push({
                    product:{ name:product},
                    quantity: quan
                })
                console.log(cart)
            }
            console.log(`${product} aded successfully`)
            // return checkitem
        }
        function removeProduct(pro){
            var proname=cart.find(function(val){
                // console.log(val.product.id)
                return val.product.name === pro
            })
            console.log(proname)
            if(proname){
                delete proname.product
                delete proname.quantity
                console.log(cart)
                console.log("Product removed successfully")
            }
        }
        function updateQuantity(Id,quan){
            var check=cart.find(function(val){
                return val.product.id===Id
            })
            console.log(check)
            if(check){
                check.quantity += quan
                console.log("quantity updated successfully")
            }
            if(!check){
                console.log("Product not found")
            }
        }
        var cart = [
            {
                product: {
                    id: 1,
                    name: "Laptop",
                    price: 60000
                },
                quantity: 1
            },
            {
                product: {
                    id: 2,
                    name: "Mouse",
                    price: 1500
                },
                quantity: 2
            }
        ];
        addProduct("keyboard", 1)
        removeProduct('keyboard');
        updateQuantity(2,3)
        // console.log(minicart)
    </script>
</body>

</html>
