<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        totalcreds=0
        function totalCredits(tot_cred){
            totalcreds += tot_cred
            return totalcreds
        }
        function credit_or_debit(cred_debt){
            var check=transactions.filter(function(val){
                return val.type===cred_debt
            })
            // console.log(check.type)
            if(check.type===cred_debt){
                // console.log(check.amount)
                return totalCredits(check.amount);
            }

        }
        var transactions = [
            { type: "credit", amount: 5000 },
            { type: "debit", amount: 2000 },
            { type: "credit", amount: 10000 },
            { type: "debit", amount: 3000 }
        ] 
        for(var i of transactions){
            console.log(i)
        }
        console.log(credit_or_debit('credit'));
    </script>
</body>
