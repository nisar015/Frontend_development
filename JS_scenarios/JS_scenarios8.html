<body>
    <script>
        function celsiusToFahrenheit(temperature){
            C2F = (temperature*9/5)+32
            if (C2F<67){
                return "Very cold"+" "+C2F+ "C";
            }
            else if(temperature<85){
                return "cold"+" "+C2F+ "C";
            }
            else if(temperature>97 && temperature<104){
                return "Normal"+" "+C2F+ "C";
            }
            else if(temperature>104 && temperature<117){
                return "Hot"+" "+C2F+ "C";
            }
            else{
                return "Very Hot"+" "+C2F+ "C";
            }
        }
        function fahrenheitToCelsius(){}
        var temp = prompt("enter temperature in Celcius: ")
        console.log(celsiusToFahrenheit(temp))
    </script>
