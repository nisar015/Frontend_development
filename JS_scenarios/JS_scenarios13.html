<body>
    <script>
        //doubt how to run priya prop
        function calculateAttendance(atten){
            for(i of atten){
                Attendance_percen=(i.presentDays/i.totalDays)*100
                if(Attendance_percen>=90){
                    return "Excellent";
                }
                else if(Attendance_percen>=75){
                    return "Good";
                }
                else if(Attendance_percen>=60){
                    return "Average";
                }
                else{
                    return "Poor";
                }
            }
        }
        var Attendance = [
            { name: "Arun", presentDays: 22, totalDays: 25 },
            { name: "Priya", presentDays: 10, totalDays: 25 }
        ];
        console.log(calculateAttendance(Attendance))

    </script>
