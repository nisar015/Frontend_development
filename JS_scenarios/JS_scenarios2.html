<body>
    <script>
        // 2.. Employee Salary Calculator 
        Employee = {
            name: "John",
            salary: 50000,
            experience: 2
        }
        
        // console.log(bonus5)
        function calculateSalary(employee){
            var bonus5=Employee["salary"]*1.05
            if (employee<3){
                return bonus5;
            }
        }
        for(var emp of Employee){
            var bonus=calculateSalary(Employee[emp])
            console.log(bonus)
        }
        
    </script>
</body>
