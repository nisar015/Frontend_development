    <script>
        // 2.. Employee Salary Calculator 
        // use ternary operator to achive this
        var Employee = {
            name: "John",
            salary: 50000,
            experience: 2
        }
        // 50000 * 0.05
        function calculateSalary(employee) {
            if (employee < 3) {
                return Employee.salary = Employee.salary + Employee.salary * (0.05);
            }
            else if (employee > 3 && employee < 5) {
                return Employee.salary += Employee.salary * (0.1);
            }
            else {
                return Employee.salary += Employee.salary * (0.15);
            }
        }
        var bonus = calculateSalary(Employee.experience)
        console.log(bonus)
