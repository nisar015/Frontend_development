<body>
    <script>
        // 2.. Employee Salary Calculator 
        var Employee = {
            name: "John",
            salary: 50000,
            experience: 6
        }
        
        // console.log(bonus5)
        var bonus5=Employee['salary']*1.05
        function calculateSalary(employee){
            if (employee<3){
                return bonus5;
            }
            // else if()
        }
        for(var emp in Employee){
            if(emp === "experience"){
                var bonus=calculateSalary(Employee[emp])
                console.log(bonus)

            }
        }
        
    </script>
