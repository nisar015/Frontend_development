<body>
    <script>
        // 2.. Employee Salary Calculator 
        var Employee = {
            name: "John",
            salary: 50000,
            experience: 6
        }
        function calculateSalary(employee){ 
            if (employee<3){
                return Employee.salary += Employee.salary*(0.05);;
            }
            else if(employee>3 && employee<5){
                return Employee.salary += Employee.salary*(0.1);
            }
            else{
                return Employee.salary += Employee.salary*(0.15);
            }
        }
        for(var emp in Employee){
            if(emp === "experience"){
                var bonus=calculateSalary(Employee[emp])
                console.log(bonus)
            }
        }
        
    </script>
</body>
