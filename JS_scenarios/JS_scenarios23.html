<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        var bon=0
        function calculateBonus(emp){
            var emp_name= Employee.find(function(val){
                return val.name===emp
            })
            if(emp_name){
                if(emp_name.performance.rating === 5){
                    bon = emp_name.salary * 0.2
                    bon += emp_name.salary
                    return bon
                }
                else if(emp_name.performance.rating === 4){
                    bon = emp_name.salary * 0.15
                    bon += emp_name.salary
                    return bon
                }
                else if(emp_name.performance.rating === 3){
                    bon = emp_name.salary * 0.1
                    bon += emp_name.salary
                    return bon
                }
                else if(emp_name.performance.rating < 3){
                    bon = emp_name.salary * 0.05
                    bon += emp_name.salary
                    return bon
                }
                

            }
            
        }
        var Employee=[
            {
                name: "Arun",
                department: "IT",
                salary: 100000,
                performance: {
                    rating: 5
                }
            },
            {
                name: "Priya",
                department: "HR",
                salary: 80000,
                performance: {
                    rating: 3
                }
            }
        ];
        // console.log(Employee[0])
        console.log(calculateBonus('Arun'));
        console.log(calculateBonus('Priya'));

    </script>
</body>

</html>
