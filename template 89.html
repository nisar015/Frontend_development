<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>template a1</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
    }
    body{
        display: block;
        font-family: Georgia, 'Times New Roman', Times, serif;
        font-size: 13px;
        color: aliceblue;
        background-color:rgb(87, 63, 9) ;
    }
    .wrapper{
        text-align: left;
    }
    .row1, .row1 a{
        background-color:olive;
        color: aliceblue;
        outline: none;
    }
    #header{
        padding: 20px 0;
        width: 960px;
        margin: 0 auto;
        overflow: auto;
    }
    #header #hgroup{
        float: left;
        margin: 0 0 20px 0;
    }
    #header #hgroup h1{
        font-size: 36px;
    }
    #header #hgroup h1,#header #hgroup h2{
        font-weight: normal;
        text-transform: none;
    }
    a{
        outline: none;
        text-decoration: none;
    }
</style>
<body>
    <div class="wrapper row1">
        <div id="header">
            <div id="hgroup">
                <h1><a href="#">Basic 89</a></h1>
                <h2>Free html template</h2>
            </div>
        </div>
