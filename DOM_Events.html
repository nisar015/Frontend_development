    <h1>HTML Form - Input Types</h1>

    <form>

        <!-- Text -->
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname">
        <br><br>


        <!-- Email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" username="username" autocomplete="username">
        <br><br>


        <!-- Password -->
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" autocomplete="current-password">
        <br><br>


        <!-- Telephone -->
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone">
        <br><br>

        <!-- Number -->
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="18" max="60">
        <br><br>

        <!-- Date -->
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">
        <br><br>

        <!-- Time -->
        <label for="time">Preferred Time:</label>
        <input type="time" id="time" name="time">
        <br><br>

        <!-- Date and Time -->
        <label for="datetime">Appointment:</label>
        <input type="datetime-local" id="datetime" name="datetime">
        <br><br>

        <!-- Month -->
        <label for="month">Joining Month:</label>
        <input type="month" id="month" name="month">
        <br><br>

        <!-- Week -->
        <label for="week">Select Week:</label>
        <input type="week" id="week" name="week">
        <br><br>

        <!-- URL -->
        <label for="website">Website:</label>
        <input type="url" id="website" name="website">
        <br><br>

        <!-- Search -->
        <label for="search">Search:</label>
        <input type="search" id="search" name="search">
        <br><br>

        <!-- Color -->
        <label for="color">Choose Color:</label>
        <input type="color" id="color" name="color">
        <br><br>

        <!-- Range -->
        <label for="range">Experience:</label>
        <input type="range" id="range" name="experience" min="0" max="10">
        <br><br>

        <!-- Radio Buttons -->
        <p>Gender:</p>

        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>

        <br><br>

        <!-- Checkboxes -->
        <p>Skills:</p>

        <input type="checkbox" id="html" name="skills" value="html">
        <label for="html">HTML</label>

        <input type="checkbox" id="css" name="skills" value="css">
        <label for="css">CSS</label>

        <input type="checkbox" id="javascript" name="skills" value="javascript">
        <label for="javascript">JavaScript</label>

        <br><br>

        <!-- File -->
        <label for="resume">Upload Resume:</label>
        <input type="file" id="resume" name="resume">
        <br><br>

        <!-- Hidden -->
        <input type="hidden" name="userId" value="101">

        <!-- Submit -->
        <input type="submit" value="Submit">

        <!-- Reset -->
        <input type="reset" value="Reset">

        <!-- Button -->
        <input type="button" value="Click Me">

    </form>
    <script>
        // diff between onmouseout & onmouseleave
        function handlechange() {
            console.log("this is a onchange eventhandler")
        }
        function focu() {
            document.getElementById("inp2").style.background = "orange"
        }
        function submit() {
            form.addEventListener("submit", function (ev) {
                ev.preventDefault();
                console.log("first")
            })
        }
        function keydon() {
            document.querySelector("input").style.color = "blue"
        }
        function keyrel() {
            // document.querySelector("input").style.color = "orange"
            var enteredval = document.getElementById("inp2").value
            if (enteredval.length >= 5) {
                document.getElementById("head").style.display = "none";
                document.body.style.background = "green";


            }
            else {
                document.getElementById("head").style.display = "block";
                document.getElementById("head").style.color = "black";
                document.body.style.background = "red";



            }
            // console.log(enteredval)
        }
        function mousenter() {
            document.getElementById("inp").style.color = "white"
        }
        function mouseup() {
            document.querySelector("input").style.background = "white"
            // document.querySelector("input").style.color="red"


        }
        function mousedown() {
            document.querySelector("input").style.background = "red"
        }
        function buttonclick() {
            document.querySelector("button").style.background = "purple"
            document.querySelector("button").style.color = "white"
            // document.body.style.background = "violet"
        }
        function doubleclick() {
            // document.getElementById("db").style.background = "green"
            // document.getElementById("db").style.color = "white"
            document.body.style.background = ""
        }
        function mouseor() {
            document.getElementById("inp").style.background = "lightgreen"
            // document.getElementById("button").style.background="lightgreen"
        }
        function mouseout() {
            // document.getElementById("inp").style.background="white"
            document.getElementById("inp").style.background = "yellow"
        }
        function mouseblur() {
            document.getElementById("inp").style.color = "black"

            document.getElementById("inp").style.background = "white"
        }
        // document.getElementById("para").style.color="purple"
        // document.querySelector("p").style.color="purple"
        // document.querySelectorAll("p")[0].style.color="purple"
        // document.getElementsByClassName("para")[0].style.color="purple"
        document.getElementsByName("inpname")[0].style.background = "purple"
        // document.getElementsByTagName("p")[0].style.color="orange"

        // changing content inside an element
        // innerHTML,textContent,innerText all are same but when we span in textContent and innerText it prints as a text on interface.
        // we use .value to make any changes in input
        function changedinnerhtml() {
            document.getElementsByClassName("para")[0].innerHTML = "<span>Hey i am changed billa..<span>";
            // document.getElementsByClassName("para")[0].innerText="<span>Hey i am changed billa..<span>";
            // document.getElementsByClassName("para")[0].innerText="Hey i am changed billa..";
            document.querySelector("p").style.color = "white"
            document.getElementById("innerin").value = "this is also changed"
            document.body.style.background = "purple";
        }

        function changegreen() {
            document.querySelector("p").setAttribute("id", "green");
        }
        function changeyellow() {
            document.querySelector("p").setAttribute("id", "yellow");
        }
        function changegred() {
            document.querySelector("p").setAttribute("id", "red");
        }

        // wt happens when i call class in place of id at line 174
        function setcolor() {
            var att = document.querySelector("p").getAttribute("id");
            console.log(att)
            if (att == "green") {
                document.querySelector("p").setAttribute("id", "yellow");
            }
            else {
                document.querySelector("p").setAttribute("id", "green");
            }
        }
        function removeall() {
            document.querySelector("p").removeAttribute("id")
        }

        // can we on add class in the classlist ?
        function classlist() {
            document.querySelector("h2").classList.add("cl")
            document.querySelector("h2").classList.add("red")
            // removelist()

        }
        function removelist() {
            document.querySelector("h2").classList.remove("red")
        }
        function toggel() {
            document.querySelector("h2").classList.toggle("red")
        }

        // Event Deligation
        var students = [
            "student1",
            "student2",
            "student3",
            "student4",
            "student5",
        ]
        students.forEach(function (student) {
            console.log(student)
            var stuli = document.createElement("li")
            stuli.innerHTML = student
            document.getElementById("ulid").appendChild(stuli)
            // document.getElementById("ulid").prepend(stuli)
        })

        // wt is eventhandler and eventlistener here
        var ulelement = document.getElementById("ulid")
        // ulelement.onclick=function(event){
        //     console.log("first",event)
        //     var clickedelement=event.target
        //     // console.log(clickedelement)
        //     // ulele.removeChild(clickedele)
        //     clickedelement.innerHTML="u changed me"
        // }
        // console.log(ulelement)

        // DOM Traversal
        console.log(ulelement.children)
        console.log(document.getElementById("predefined").childNodes)
        console.log(document.getElementById("predefined").parentElement)
        console.log(document.getElementById("predefined").firstElementChild)
        console.log(document.getElementById("predefined").lastElementChild)
        console.log(document.getElementById("predefined").previousElementSibling)
        console.log(document.getElementById("predefined").closest("div"))
        console.log(document.getElementById("predefined").matches("#predefined"))

        // Add Event Listener
        // console.log(ulele.children.length)
        function handleclick(event) {
            var clickedelement = event.target;
            console.log(ulelement.children.length)
            ulelement.removeChild(clickedelement)
            if (ulelement.children.length <= 3) {
                ulelement.removeEventListener('click', handleclick)
                console.log("cant remove if element length is 3")

            }

        }
        // ulelement.onclick=function(event){
        //     console.log(event.target)
        // }  same as below addEventListener
        ulelement.addEventListener('click', handleclick)

        document.addEventListener("DOMContentLoaded", function () {
            console.log("DOM is loaded")
        })
        window.addEventListener("load", function () {
            console.log("load is loaded")
        })
        window.addEventListener("resize", function () {
            console.log("page is resized")
        })
        window.addEventListener("scroll", function () {
            console.log("page is scrolled")
        })

        // event obj
        document.querySelector("form").addEventListener("click", function (event) {
            event.preventDefault();
            console.log("triggered prevent default")
        })


    </script>
