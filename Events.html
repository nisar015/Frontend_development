    <input type="text" id="inp" 
    onmouseup=mouseup() 
    onfocus="focu()"
    onmousedown="mousedown()"
    onmouseenter=mousenter() 
    onmouseout="mouseout()"
    onblur="mouseblur()"
    onmouseover="mouseor()" 
    onkeydown="keydon()" 
    onkeyup="keyrel()" 
    onsubmit="submit()">
    <input type="text" name="" id="inp2" onfocus="focu()" onkeyup="keyrel()"
    onchange="handlechange()" >
    <h1 id="head">this is a heading tag</h1>
    <script>
        // diff between onmouseout & onmouseleave
        function handlechange(){
            console.log("this is a onchange eventhandler")
        }
        function focu(){
            document.getElementById("inp2").style.background="orange"
        }
        function submit() {
            form.addEventListener("submit", function (ev) {
                ev.preventDefault();
                console.log("first")
            })
        }
        function keydon() {
            document.querySelector("input").style.color = "blue"
        }
        function keyrel() {
            document.querySelector("input").style.color = "orange"
            var enteredval=document.getElementById("inp2").value
            if(enteredval.length>=5){
                document.getElementById("head").style.display="block";

            }
            // console.log(enteredval)
        }
        function mousenter() {
            document.getElementById("inp").style.color = "white"
        }
        function mouseup() {
            document.querySelector("input").style.background = "white"
            // document.querySelector("input").style.color="red"


        }
        function mousedown() {
            document.querySelector("input").style.background = "red"
        }
        function buttonclick() {
            document.querySelector("button").style.background = "purple"
            document.querySelector("button").style.color = "white"
        }
        function doubleclick() {
            document.getElementById("db").style.background = "green"
            document.getElementById("db").style.color = "white"
            // document.querySelector("h1").style.color="red"
        }
        function mouseor() {
            document.getElementById("inp").style.background = "lightgreen"
            // document.getElementById("button").style.background="lightgreen"
        }
        function mouseout() {
            // document.getElementById("inp").style.background="white"
            document.getElementById("inp").style.background = "yellow"
        }
        function mouseblur() {
            document.getElementById("inp").style.color="black"

            document.getElementById("inp").style.background = "pink"
        }
    </script>
