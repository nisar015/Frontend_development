<body>

    <input type="text" id="inp" 
    onmouseup=mouseup() 
    onfocus="focu()"
    onmousedown="mousedown()"
    onmouseenter=mousenter() 
    onmouseout="mouseout()"
    onblur="mouseblur()"
    onmouseover="mouseor()" 
    onkeydown="keydon()" 
    onkeyup="keyrel()" 
    onsubmit="submit()">

    <input type="text" name="inpname" id="inp2" onfocus="focu()" onkeyup="keyrel()"
    onchange="handlechange()" >

    <button  onclick="changedinnerhtml()" ondblclick="doubleclick()" id="butt">click</button>

    <h1 id="head">enter min 5 chars</h1>

    <p id="green">this is a para</p>

    <h2 class="h">this is a heading tag</h2>

    <input type="text" id="innerin">
    <button onclick="setcolor()">button1</button>
    <button onclick="changeyellow()">button2</button>
    <button onclick="changegred()">button3</button>
    <button onclick="classlist()">CL butt</button>
    <button onclick="removeall()">remove all</button>
    <script>
        // diff between onmouseout & onmouseleave
        function handlechange(){
            console.log("this is a onchange eventhandler")
        }
        function focu(){
            document.getElementById("inp2").style.background="orange"
        }
        function submit() {
            form.addEventListener("submit", function (ev) {
                ev.preventDefault();
                console.log("first")
            })
        }
        function keydon() {
            document.querySelector("input").style.color = "blue"
        }
        function keyrel() {
            // document.querySelector("input").style.color = "orange"
            var enteredval=document.getElementById("inp2").value
            if(enteredval.length>=5){
                document.getElementById("head").style.display="none";
                document.body.style.background="green";
                
                
            }
            else{
                document.getElementById("head").style.display="block";
                document.getElementById("head").style.color="black";
                document.body.style.background="red";



            }
            // console.log(enteredval)
        }
        function mousenter() {
            document.getElementById("inp").style.color = "white"
        }
        function mouseup() {
            document.querySelector("input").style.background = "white"
            // document.querySelector("input").style.color="red"


        }
        function mousedown() {
            document.querySelector("input").style.background = "red"
        }
        function buttonclick() {
            document.querySelector("button").style.background = "purple"
            document.querySelector("button").style.color = "white"
            // document.body.style.background = "violet"
        }
        function doubleclick() {
            // document.getElementById("db").style.background = "green"
            // document.getElementById("db").style.color = "white"
            document.body.style.background=""
        }
        function mouseor() {
            document.getElementById("inp").style.background = "lightgreen"
            // document.getElementById("button").style.background="lightgreen"
        }
        function mouseout() {
            // document.getElementById("inp").style.background="white"
            document.getElementById("inp").style.background = "yellow"
        }
        function mouseblur() {
            document.getElementById("inp").style.color="black"

            document.getElementById("inp").style.background = "white"
        }
        // document.getElementById("para").style.color="purple"
        // document.querySelector("p").style.color="purple"
        // document.querySelectorAll("p")[0].style.color="purple"
        // document.getElementsByClassName("para")[0].style.color="purple"
        document.getElementsByName("inpname")[0].style.background="purple"
        // document.getElementsByTagName("p")[0].style.color="orange"

        // changing content inside an element
        // innerHTML,textContent,innerText all are same but when we span in textContent and innerText it prints as a text on interface.
        // we use .value to make any changes in input
        function changedinnerhtml(){
            document.getElementsByClassName("para")[0].innerHTML="<span>Hey i am changed billa..<span>";
            // document.getElementsByClassName("para")[0].innerText="<span>Hey i am changed billa..<span>";
            // document.getElementsByClassName("para")[0].innerText="Hey i am changed billa..";
            document.querySelector("p").style.color="white"
            document.getElementById("innerin").value="this is also changed"
            document.body.style.background="purple";
        }

        function changegreen(){
            document.querySelector("p").setAttribute("id","green");
        }
        function changeyellow(){
            document.querySelector("p").setAttribute("id","yellow");
        }
        function changegred(){
            document.querySelector("p").setAttribute("id","red");
        }

        function setcolor(){
            var att=document.querySelector("p").getAttribute("id");
            console.log(att)
            if(att=="green"){
                document.querySelector("p").setAttribute("id","yellow");
            }
            else{
                document.querySelector("p").setAttribute("id","green");
            }
        }
        function removeall(){
            document.querySelector("p").removeAttribute("id")
        }
        function classlist(){
            document.querySelector("h2").classList.add("red")
        }

        

    </script>
</body>
