<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick=buttonclick()>click</button>
    <button id="db" ondblclick=doubleclick() onmouseover=mouseor() onmouseleave=mouseleave() onmousedown=mousedown()>dbclick</button>
    <input type="text" id="inp"
    onmousedown=mousedown() 
    onmouseup=mouseup()
    onmouseenter=mousenter()>
    <h1>this is a heading tag</h1>
    <script>
        function mouseup(){
            document.querySelector("input").style.background="white"
            document.querySelector("input").style.color="red"
            

        }
        function mousedown(){
            document.querySelector("input").style.background="red"
        }
        function buttonclick(){
            document.querySelector("button").style.background="purple"
            document.querySelector("button").style.color="white"
        }
        function doubleclick(){
            document.getElementById("db").style.background="green"
            document.getElementById("db").style.color="white"
            document.querySelector("h1").style.color="red"
        }
        function mouseor(){
            document.getElementById("db").style.background="lightgreen"
        }
        function mouseleave(){
            document.getElementById("db").style.background=""
        }
    </script>
</body>
</html>
