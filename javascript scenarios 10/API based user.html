<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background: lightslategray;
        }

        table {
            margin: auto;
            width: 80%;
            align-items: center;
        }
    </style>
</head>

<body>
    <table border="1px solid green">
        <thead>
            <tr>
                <th>id</th>
                <th>Name</th>
                <th>Email</th>
                <th>City</th>
                <th>Company</th>
                <th>delete</th>
                <th>Edit</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>

    <form>

        <!-- Text -->
        <label for="ID">Id :</label>
        <input type="id" id="id" name="id">
        <br><br>

        <!-- Email -->
        <label for="name">Name</label>
        <input type="name" id="name" name="name" username="username" autocomplete="username">
        <br><br>

        <!-- Password -->
        <label for="Email">email</label>
        <input type="email" id="email" name="email" autocomplete="email">
        <br><br>

        <!-- Telephone -->
        <label for="city">city</label>
        <input type="city" id="city" name="city">
        <br><br>

        <!-- Number -->
        <label for="Company">Company</label>
        <input type="company" id="company" name="company">
        <br><br>
        <button type="button" onclick="handleadduser()" id="">add user</button>
        <button type="button" onclick="update()" id="updatebutton">update</button>
    </form>
    <script>
        function getdatafromserver() {
            fetch("http://localhost:3000/users").then(function (response) {
                return response.json()
            }).then(function (data) {
                console.log(data)
                displayusers(data)
            })
        }
        getdatafromserver()
        function displayusers(usersdata) {
            document.querySelector("tbody").innerHTML = ""
            usersdata.forEach(function (user, index) {
                // console.log(user)
                var mytr = document.createElement("tr")
                mytr.innerHTML = `

                <td>${user.id}</td>
                <td>${user.Name}</td>
                <td>${user.Email}</td>
                <td>${user.City}</td>
                <td>${user.Company}</td>
                <td><button onclick=handledelete(${user.id})>delete</button></td>
                <td><button onclick=handledit(${user.id})>Edit</button></td>

                `
                document.querySelector("tbody").appendChild(mytr)
            })
        }
        function handledelete(id) {
            fetch("http://localhost:3000/users/" + id, {
                method: "DELETE"
            }).then(function () {
                getdatafromserver()
            })
        }
        function handleadduser() {
            var user = {
                id: document.getElementById("id").value,
                Name: document.getElementById("name").value,
                Email: document.getElementById("email").value,
                City: document.getElementById("city").value,
                Company: document.getElementById("company").value
            }
            fetch("http://localhost:3000/users", {
                method: "POST",
                body: JSON.stringify(user),
                headers: {
                    "Content-Type": "application/json"
                }

            }).then(function () {
                getdatafromserver()
            })
        }
        function handledit(id){
            fetch("http://localhost:3000/users/"+id).then(function(response){
                return response.json()
            }).then(function(user){
                console.log(user)
                document.getElementById("id").value=user.id
                document.getElementById("name").value=user.Name
                document.getElementById("email").value=user.Email
                document.getElementById("city").value=user.City
                document.getElementById("company").value=user.Company
                document.getElementById("updatebutton").style.display="block";
            })
        }

    </script>
</body>

</html>
