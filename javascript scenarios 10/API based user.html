<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            margin: auto;
            width: 80%;
            align-items: center;
        }
    </style>
</head>

<body>
    <table border="1px solid green">
        <thead>
            <tr>
                <th>id</th>
                <th>Name</th>
                <th>Email</th>
                <th>City</th>
                <th>Company</th>
                <th>delete</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>

    <form>

        <!-- Text -->
        <label for="ID">Id :</label>
        <input type="id" id="id" name="id">
        <br><br>

        <!-- Email -->
        <label for="name">Name</label>
        <input type="name" id="name" name="name" username="username" autocomplete="username">
        <br><br>

        <!-- Password -->
        <label for="Email">age</label>
        <input type="email" id="email" name="email" autocomplete="email">
        <br><br>

        <!-- Telephone -->
        <label for="city">city</label>
        <input type="city" id="city" name="city">
        <br><br>

        <!-- Number -->
        <label for="Company">Company</label>
        <input type="company" id="company" name="company">
        <br><br>
        <button onclick="handleadduser()" id="handleadduser">add user</button>
    </form>
    <script>
        function getdatafromserver() {
            fetch("http://localhost:3000/users").then(function (response) {
                return response.json()
            }).then(function (data) {
                console.log(data)
                displayusers(data)
            })
        }
        getdatafromserver()
        function displayusers(usersdata) {
            document.querySelector("tbody").innerHTML = ""
            usersdata.forEach(function (user) {
                console.log(user)
                var mytr = document.createElement("tr")
                mytr.innerHTML = `

                <td>${user.id}</td>
                <td>${user.Name}</td>
                <td>${user.Email}</td>
                <td>${user.City}</td>
                <td>${user.Company}</td>
                <td><button onclick=handledelete(${user.id})>delete</button></td>

                `
                document.querySelector("tbody").appendChild(mytr)
            })
        }
        function handledelete(id) {
            fetch("http://localhost:3000/users/" + id, {
                method: "DELETE"
            }).then(function () {
                getdatafromserver()
            })
        }
        // displayusers()

    </script>
</body>

</html>
