
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shopping Website</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <style>
        #Products {
            width: 100%;
            overflow: auto;
            padding: 15px;
        }

        #Products li {
            list-style: none;
            width: 200px;
            float: left;
            margin: 10px;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .cart-btn {
            position: relative;
        }

        #cartcount {
            position: absolute;
            top: -8px;
            right: -8px;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">

            <!-- Website Name -->
            <a class="navbar-brand" href="#">MyShop</a>

            <!-- Home Button -->
            <a href="./mini ecommerce by sir.html" class="btn btn-outline-light me-3"
                onclick="getallproducts(); return false;">
                <i class="bi bi-house"></i> Home
            </a>

            <!-- Search Bar -->
            <form class="d-flex flex-grow-1 me-3" onsubmit="searchproducts(); return false;">
                <input class="form-control me-2"
                    type="search"
                    id="search"
                    placeholder="Search products..."
                    aria-label="Search">

                <button class="btn btn-warning" type="submit">
                    <i class="bi bi-search"></i>
                </button>
            </form>

            <!-- Cart Button -->
            <button class="btn btn-outline-light cart-btn"
                onclick="viewcart()">
                <i class="bi bi-cart3"></i> Cart
                <span id="cartcount"
                    class="badge bg-danger rounded-pill">0</span>
            </button>

        </div>
    </nav>

    <!-- Products -->
    <!-- <div class="container-fluid mt-4">
        <h3 class="mb-3">Our Products</h3>
        <ul id="Products"></ul>
    </div> -->

    <script>
        
    </script>

</body>
</html>
