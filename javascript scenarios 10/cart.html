<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="icon" href="/docs/4.0/assets/img/favicons/favicon.ico">

    <title>Sticky Footer Navbar Template for Bootstrap</title>

    <link rel="canonical" href="https://getbootstrap.com/docs/4.0/examples/sticky-footer-navbar/">

    <!-- Bootstrap core CSS -->
    <link href="https://getbootstrap.com/docs/4.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom styles for this template -->
    <link href="https://getbootstrap.com/docs/4.0/examples/sticky-footer-navbar/sticky-footer-navbar.css"
        rel="stylesheet">
    <style>
        li {
            display: inline-block;
            margin: 10px;
        }

        img {
            width: 100%;
            height: 250px;
        }

        h2 {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <header>

        <!-- Bootstrap Icons CDN -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

        <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
            <a class="navbar-brand" href="#">Fixed navbar</a>

            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarCollapse"
                aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarCollapse">

                <ul class="navbar-nav mr-auto">
                    <li class="nav-item active">
                        <a class="nav-link" href="./copycode.html">
                            Home <span class="sr-only">(current)</span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Link</a>
                    </li>
                </ul>

                <form class="form-inline mt-2 mt-md-0 mr-3">
                    <input class="form-control mr-sm-2" type="text" placeholder="Search" aria-label="Search">

                    <button class="btn btn-outline-success my-2 my-sm-0" type="submit">
                        Search
                    </button>
                </form>

                <!-- Shopping Cart -->
                <a href="#" class="nav-link text-white position-relative mr-3" aria-label="Shopping cart, 3 items"
                    onclick="navigateToCart()">
                    <i class="bi bi-cart3" style="font-size: 24px;"></i>

                    <span id="cartCount" class="badge badge-danger" style="position: absolute; top: 0; right: 0;
                         font-size: 10px;">
                        0
                    </span>
                </a>

            </div>
        </nav>

    </header>

    <main role="main" class="container">
        <h2>Welcome to Cart</h2>

        <h1>Total Cart Items : <span id="totalItems"></span></h1>
        <h2>Amount Payble : <span id="amountPayble"></span></h2>
        <ul id="cartpros">

        </ul>
        <script>
            //    var allCartItems = JSON.parse(localStorage.getItem("cartItems"))
            //    document.getElementById("cartCount").innerHTML = allCartItems.length;
        </script>

    </main>

    <footer class="footer">
        <div class="container">
            <span class="text-muted">Place sticky footer content here.</span>
        </div>
    </footer>


    <script>
        var allCartItems = []
        function displayCartCount(quant) {
            fetch("http://localhost:3000/cart").then(function (response) {
                return response.json()
            }).then(function (data) {
                console.log(data);
                allCartItems = data;
                document.getElementById("cartCount").innerHTML = data.length
                document.getElementById("totalItems").innerHTML = data.length;

                var totalAmount = data.reduce(function (a, b) {
                    return a + (
                        Number(b.price) * Number(b.quantity || 1)
                    );
                }, 0);
                document.getElementById("amountPayble").innerHTML =
                    "₹ " + totalAmount
                // document.getElementById("amountPayble").innerHTML = totalAmount

                console.log(totalAmount);
            })
        }
        function getAllProducts() {
            fetch("http://localhost:3000/cart").then(function (response) {
                return response.json()
            }).then(function (data) {
                allProducts = data;
                displayProducts(data)
            })
        }

        getAllProducts();
        function displayProducts(data) {
            document.querySelector("#cartpros").innerHTML = ""
            data.forEach(function (product, i) {
                var myLi = document.createElement("li");
                var quantity = product.quantity || 1;
                myLi.innerHTML = `
                <div class="card" style="width: 18rem;">
                    
                    <img src="${product.image}" class="card-img-top" alt="Product Image">
                    
                    <div class="card-body">

                        <h5 class="card-title">${product.name}</h5>
                        
                        <p class="card-text">
                            ${product.description}
                            </p>

                            <h5 class="text-success">₹ ${product.price}</h5>

                <!-- Quantity Controls -->
                <div class="d-flex align-items-center gap-2 mb-3">

                    <button class="btn btn-outline-secondary"
                    onclick="updateQuantity(${product.id}, -1)">
                    <i class="bi bi-dash"></i>
                    </button>
                    
                    <span id="quantity-${product.id}"
                            class="fw-bold">
                            ${quantity}
                        </span>

                        <button class="btn btn-outline-primary"
                            onclick="updateQuantity(${product.id}, 1)">
                            <i class="bi bi-plus"></i>
                        </button>

                    </div>
                <button class="btn btn-primary" onclick="deletefromcart(${product.id})">
                    <i class="bi bi-cart-plus"></i>
                    remove
                </button>

            </div>
        </div>
        
        `
                document.querySelector("#cartpros").appendChild(myLi)
            })

        }

        function updateQuantity(productId, change) {
            var quantityElement = document.getElementById("quantity-" + productId
            );

            var quantity = Number(quantityElement.innerText);

            console.log(change);
            quantity = quantity + change;
            console.log(quantity);
            // Quantity cannot go below 1
            if (quantity < 1) {
                quantity = 1;
            }

            quantityElement.innerHTML = quantity;
            fetch("http://localhost:3000/cart/" + productId, {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    quantity: quantity
                })
            })
            // displayCartCount();
        }

        function deletefromcart(index) {
            fetch("http://localhost:3000/cart/" + index, {
                method: "DELETE"
            }).then(function () {
                displayCartCount()
            })
        }
    </script>

</body>

</html>
