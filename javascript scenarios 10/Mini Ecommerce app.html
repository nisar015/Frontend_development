    <script>
        function getdatafromserver(){
            fetch("http://localhost:3000/Products").then(function(response){
                return response.json()
            }).then(function(data){
                console.log(data);
                displayproducts(data)
            })
        }
        getdatafromserver()
        function getdatafromserverforcart(){
            fetch("http://localhost:3000/cart").then(function(response){
                return response.json()
            }).then(function(cartdata){
                console.log(cartdata);
                displaycartproducts(cartdata)
            })

        }
        getdatafromserverforcart()
        function displayproducts(product){
            console.log(product);
            document.getElementById("container").innerHTML=""
            product.forEach(function(pro){

                var card=document.createElement('div')
                card.innerHTML=`
                <img src="${pro.image}">
                <p>${pro.name}</p>
                <p>${pro.category}</p>
                <p>${pro.price}</p>
                <p>${pro.rating}</p>
                <button onclick="addtocart(${pro.id})">Add to cart</button>
                `
                document.getElementById("container").appendChild(card)
            })
            
        }
        function displaycartproducts(cartproducts){
            cartproducts.forEach(function(cartpro){
                var cartproduct=document.createElement('div')
                cartproduct.innerHTML=`
                <img src="${cartpro.image}">
                <p>${cartpro.name}</p>
                <p>${cartpro.category}</p>
                <p>${cartpro.price}</p>
                <p>${cartpro.rating}</p>
                `
                document.getElementById("cartcont").appendChild(cartproduct)
            })
        }
        function addtocart(id){
            fetch("http://localhost:3000/Products").then(function(response){
                return response.json()
            }).then(function(data){
                var check=data.find(function(p){
                    return p.id===id
                })
                console.log(check);
                var newpro={
                    image:check.image,
                    name:check.name,
                    category:check.category,
                    price:check.price,
                    rating:check.rating,
                }
                fetch("http://localhost:3000/cart",{
                    method:"POST",
                    body:JSON.stringify(newpro),
                    headers:{
                        "Content-Type": "application/json"
                    }
                }).then(function(){
                    getdatafromserverforcart()
                })
            })
        }
        function searchuser(){
            var searchpro=document.getElementById("id").value
            fetch("http://localhost:3000/Products/"+searchpro).then(function(response){
                return response.json()
            }).then(function(data){
                console.log(data);
                var findsearchpro=data.filter(function(proname){
                    return proname.name==searchpro
                })
                console.log(findsearchpro);
                displayproducts([findsearchpro])
            })
        }
    </script>
