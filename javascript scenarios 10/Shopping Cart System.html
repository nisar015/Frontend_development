<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1.Shopping Cart System</title>
    <style>
        table{
            width: 450px;
            height: 200px;
            background: greenyellow;
        }

    </style>
</head>
<body>
    <table border="1px solid">
        <thead>
            <th>name</th>
            <th>price</th>
            <th>quantity</th>
            <th>Delete Product</th>
        </thead>
        <tbody></tbody>
    </table>
    <script>
        var cart=[]
        var products = [
            { id:1,name: "Laptop", price: 60000 ,quantity:1},
            { id:2,name: "Mouse", price: 1500,quantity:1 },
            { id:3,name: "Keyboard", price: 3000,quantity:2 }
        ]
        function addproduct(){
            products.forEach(function(pro,index){
                var mytr=document.createElement("tr")
                mytr.innerHTML=`

                <td>${pro.id}</td>
                <td>${pro.name}</td>
                <td>${pro.price}</td>
                <td>${pro.quantity}</td>
                <td><button onclick=deleteproduct()>${pro.quantity}<button></td>
                `
                document.querySelector("tbody").appendChild(mytr)
            })

        }
        addproduct()

        
    </script>
    
</body>
</html>
