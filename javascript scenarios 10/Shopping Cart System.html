<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1.Shopping Cart System</title>
    <style>
        table {
            width: 450px;
            height: 200px;
            background: greenyellow;
        }
    </style>
</head>

<body>
    <table border="1px solid">
        <thead>
            <th>id</th>
            <th>name</th>
            <th>price</th>
            <th>quantity</th>
            <th>Delete Product</th>
            <th>quantity</th>
            <!-- <th>update quantity</th> -->
        </thead>
        <tbody></tbody>
    </table>
    <form>

        <label for="id">id</label>
        <input type="id" id="id" name="id">
        <br>
        <label for="name">name</label>
        <input type="name" id="name" name="name" username="username">
        <br>
        <label for="price">price</label>
        <input type="price" id="price" name="price">
        <br>
        <label for="quantity">quantity</label>
        <input type="quantity" id="quantity" name="quantity">
        <br>
        <button type="button" onclick="addproduct()">add product</button>
        <button type="button" onclick="updatequantity()">update quantity</button>

    </form>
    <script>

        // var check=products.find(function(val){
        //     return val.id==id
        // })
        // if(check){
        //     check.quantity += newquan
        //     return check.quantity
        // }
        // else{
        //     return "product not found!!!"
        // }

        var products = [
            { id: 1, name: "Laptop", price: 60000, quantity: 1 },
            { id: 2, name: "Mouse", price: 1500, quantity: 1 },
            { id: 3, name: "Keyboard", price: 3000, quantity: 2 }
        ]
        // console.log(updatequantity(4,2))


        function displayproduct() {
            document.querySelector("tbody").innerHTML = ""
            products.forEach(function (pro, index) {
                var mytr = document.createElement("tr")
                mytr.innerHTML = `
                <td>${pro.id}</td>
                <td>${pro.name}</td>
                <td>${pro.price}</td>
                <td>${pro.quantity}</td>
                <td><button onclick="deleteproduct(${pro.id},${index})">delete</button></td>
                <td><button onclick="editquantity(${index})">edit quantity</button></td>`

                document.querySelector("tbody").appendChild(mytr)
            })

        }
        displayproduct()
        function deleteproduct(id, index) {
            products.splice(index, 1)
            displayproduct()
        }
        function addproduct() {
            var pro = {
                id: document.getElementById("id").value,
                name: document.getElementById("name").value,
                price: document.getElementById("price").value,
                quantity: document.getElementById("quantity").value
            }
            products.push(pro)
            displayproduct()
        }
        var editindex = null
        function editquantity(index) {
            editindex = index,
                // console.log(editindex)
                document.getElementById("id").value = products[editindex].id
            document.getElementById("name").value = products[editindex].name
            document.getElementById("price").value = products[editindex].price
            document.getElementById("quantity").value = products[editindex].quantity
        }
        function updatequantity() {
            var pro = {
                id: document.getElementById("id").value,
                name: document.getElementById("name").value,
                price: document.getElementById("price").value,
                quantity: document.getElementById("quantity").value

            }
            products[editindex]=pro
            displayproduct()
        }



    </script>

</body>

</html>
