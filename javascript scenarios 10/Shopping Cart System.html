<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1.Shopping Cart System</title>
    <style>
        img{
            width: 150px;
            height: 100px;
            background: greenyellow;
        }

    </style>
</head>
<body>
    <table border="1px solid">
        <thead>
            <th>name</th>
            <th>price</th>
            <th>quantity</th>
        </thead>
        <tbody></tbody>
    </table>
    <script>
        var cart=[]
        var products = [
            { name: "Laptop", price: 60000 ,quantity:1},
            { name: "Mouse", price: 1500,quantity:1 },
            { name: "Keyboard", price: 3000,quantity:2 }
        ]
        products.forEach(function(pro){
            var mytr=document.createElement("tr")
            mytr.innerHTML=`
            <td>${pro.name}</td>
            <td>${pro.price}</td>
            <td>${pro.quantity}</td>`
            document.querySelector("tbody").appendChild(mytr)
        })
        
    </script>
    
</body>
</html>
