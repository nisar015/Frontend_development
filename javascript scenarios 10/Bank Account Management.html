        <button type="button" onclick="depositamount()" id="depoamnt">deposit Amount</button>

                    <td><button onclick="deposit(${j})">Deposit</button></td>

                    `
                    document.querySelector("tbody").appendChild(mytr)
                })

            }
        }
        displayaccountholders()
        function addaccount() {
            var hold = {
                name: document.getElementById("name").value,
                AccNumber: document.getElementById("Accnum").value,
                AccType: document.getElementById("Acctype").value,
                deposits: [
                    {
                        deposit: Number(document.getElementById("depost").value),
                        accountbalance: Number(document.getElementById("Accbls").value)
                    }

                ]
            }
            AccHolders.push(hold)
            displayaccountholders()
        }

            }
            document.getElementById("creatacc").style.display = "none"
            document.getElementById("addacc").style.display = "block"
        }
