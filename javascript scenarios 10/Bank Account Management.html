<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <table border="1">
        <thead>
            <tr>
                <th>Account Holder Name</th>
                <th>Account Number</th>
                <th>Account Type</th>
                <th>Account Balance</th>
                <th>Create Account</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <form>
        <label for="name">Enter Acc Holder name</label>
        <input type="name" id="name">
        <br><br>
        <label for="Accnum">Enter Acc Number</label>
        <input type="Accnum" id="Accnum">
        <br><br>
        <label for="Acctype">Enter Acc Type</label>
        <input type="Acctype" id="Acctype">
        <br><br>
        <label for="Accbls">Enter Acc Balance</label>
        <input type="Accbls" id="Accbls">
        <br><br>
        <button type="button" onclick="addaccount()">Add Account</button>
        <button type="button" onclick="creatingaccount()">create Account</button>
    </form>
    <script>
        var AccHolders = [
            {
                name: "Nisar Ahmmed",
                AccNumber: 1245365,
                AccType: "savings",
                AccBal: 1000
            }
        ]
        function displayaccountholders() {
            document.querySelector("tbody").innerHTML=""
            AccHolders.forEach(function (holder) {
                var mytr = document.createElement("tr")
                mytr.innerHTML = `
                <td>${holder.name}</td>
                <td>${holder.AccNumber}</td>
                <td>${holder.AccType}</td>
                <td>${holder.AccBal}</td>
                `
                document.querySelector("tbody").appendChild(mytr)
            })
        }
        displayaccountholders()
        function addaccount(){
            var hold={
                name:document.getElementById("name").value,
                AccNumber:document.getElementById("Accnum").value,
                AccType:document.getElementById("Acctype").value,
                AccBal:document.getElementById("Accbls").value,
            }
            AccHolders.push(hold)
            displayaccountholders()
        }

    </script>
</body>

</html>
