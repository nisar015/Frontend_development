<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    input,
    label,
    #addacc,#depoamnt {
        display: none;
    }
</style>

<body>
    <table border="1">
        <thead>
            <tr>
                <th>Account Holder Name</th>
                <th>Account Number</th>
                <th>Account Type</th>
                <th>deposited amount</th>
                <th>Account Balance</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <form>
        <label for="name">Enter Acc Holder name</label>
        <input type="name" id="name">
        <!-- <br><br> -->
        <label for="Accnum">Enter Acc Number</label>
        <input type="Accnum" id="Accnum">
        <!-- <br><br> -->
        <label for="Acctype">Enter Acc Type</label>
        <input type="Acctype" id="Acctype">
        <!-- <br><br> -->
        <label for="depost">Enter deposit amount</label>
        <input type="depost" id="depost" class="depost">
        <!-- <br><br> -->
        <label for="Accbls">Enter Acc Balance</label>
        <input type="Accbls" id="Accbls" class="Accbls">
        <!-- <br><br> -->
        <button type="button" onclick="addaccount()" id="addacc">Add Account</button>
        <button type="button" onclick="createaccount()" id="creatacc">create Account</button>
        <button type="button" onclick="depositamount()" id="depoamnt">deposit Amount</button>
    </form>
    <script>
        var AccHolders = [
            {
                name: "Nisar Ahmmed",
                AccNumber: 1245365,
                AccType: "savings",
                deposits:[
                    {
                        deposit:500,
                        accountbalance:250
                    }
                ]
            }
        ]
        console.log(AccHolders[0].deposits.length);
        console.log(AccHolders[0].deposits[AccHolders[0].deposits.length-1].accountbalance);
        // console.log(AccHolders[0].deposits[[0].deposits.length-1].accountbalance)
        function displayaccountholders() {
            document.querySelector("tbody").innerHTML = ""
            AccHolders[0].deposits.forEach(function (holder,i) {
                var mytr = document.createElement("tr")
                mytr.innerHTML = `
                
                <td>${AccHolders[0].name}</td>
                <td>${AccHolders[0].AccNumber}</td>
                <td>${AccHolders[0].AccType}</td>
                <td>${holder.deposit}</td>
                <td>${holder.accountbalance}</td>
                <td><button onclick="deposit(${i})">Deposit</button></td>
  
                `
                document.querySelector("tbody").appendChild(mytr)
            })
        }
        displayaccountholders()
        function addaccount() {
            var hold = {
                name: document.getElementById("name").value,
                AccNumber: document.getElementById("Accnum").value,
                AccType: document.getElementById("Acctype").value,
                deposit: document.getElementById("depost").value,
                AccBal: document.getElementById("Accbls").value
            }
            AccHolders.push(hold)
            displayaccountholders()
        }
        function createaccount() {
            for (var i = 0; i < 5; i++) {
                document.getElementsByTagName("label")[i].style.display = "block"
                document.getElementsByTagName("input")[i].style.display = "block"
            }
            document.getElementById("creatacc").style.display = "none"
            document.getElementById("addacc").style.display = "block"
        }
        function depositamount(){
            var enteredeposit=Number(document.getElementById("depost").value)
            var newdeposit={
                deposit:enteredeposit,
                accountbalance:AccHolders[0].deposits[AccHolders[0].deposits.length-1].accountbalance+enteredeposit,
            }
            AccHolders[0].deposits=[newdeposit]
            displayaccountholders()
            document.querySelector("form").reset()


        }
        function deposit(index){
            for (var i = 0; i < 5; i++) {
                document.getElementsByTagName("label")[i].style.display = "none"
                document.getElementsByTagName("input")[i].style.display = "none"
            }
            
            document.getElementById("creatacc").style.display = "none"
            document.getElementById("addacc").style.display = "none"

            document.getElementById("depost").style.display="block";
            document.getElementById("depoamnt").style.display="block"
        }
        
         
    </script>
</body>

</html>
