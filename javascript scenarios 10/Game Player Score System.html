<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2 id="heading">Game Starts</h2>
    <button onclick="attack()">enemy attacked</button>
    <button onclick="defeat()">defeat enemy</button>
    <button onclick="coins()">collect coins</button>
    <button onclick="Health()">collect Health</button>
    <script>
        var playerHS = {
            Health: 100,
            Score: 0
        }
        
        function attack() {
            playerHS.Health -= 50
            document.getElementById("heading").innerHTML=`Enemy attacked player, Health is ${playerHS.Health}`
        }
        function defeat() {
            playerHS.Score += 10
            document.getElementById("heading").innerHTML=`player defeated enemy, Score ${playerHS.Score}`
        }
        function coins() {
            playerHS.Score += 2
            document.getElementById("heading").innerHTML=`player collected coins, Score ${playerHS.Score}`
        }
        function Health() {
            playerHS.Score += 10
            document.getElementById("heading").innerHTML=`player collects Health,Score ${playerHS.Score}`
        }
        //if enemy attacks is a button then health decreases. how to implement this using CRUD
    </script>
</body>

</html>
