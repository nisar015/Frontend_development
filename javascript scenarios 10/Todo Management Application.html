<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    table {
        width: 80%;
        margin: auto;
    }

    #updatebutton {
        display: none;
    }
</style>

<body>
    <select name="" id="filtertodos" onchange="handletodos()">
        <option value="Yet to start">yet to start</option>
        <option value="pending">pending</option>
        <option value="completed">completed</option>

    </select>
    <table border="1px solid grey">
        <thead>
            <tr>
                <th>id</th>
                <th>Title</th>
                <!-- <th>Add Task</th> -->
                <th>status</th>
                <th>Edit Task</th>
                <th>Delete Task</th>

            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <br><br>
    <form>
        <label for="id">id</label>
        <input type="id" id="id" name="id">
        <br><br>
        <label for="title">title</label>
        <input type="title" id="title" name="title">
        <br><br>
        <label for="status">status</label>
        <select name="status" id="status">
            <option value="Yet to start">yet to start</option>
            <option value="pending">pending</option>
            <option value="completed">completed</option>
        </select>
        <br><br>
        <button type="button" onclick="addtask()" id="addbutton">add task</button>
        <button type="button" onclick="updatetask()" id="updatebutton">update task</button>
    </form>
    <script>
        var Todolist = [
            {
                id: 1,
                title: "LearnJavaScript",
                status: "completed"
            },
            {
                id: 2,
                title: "PracticeArrays",
                status: "pending"
            },
            {
                id: 3,
                title: "BuildTodoApp",
                status: "Yet to start"
            }

        ]
        function displaytasks() {
            document.querySelector("tbody").innerHTML = ""
            Todolist.forEach(function (todo, index) {
                var statusbadge = "";
                if (todo.status === "completed") {
                    statusbadge = `<span>completed</span>`
                }
                else if (todo.status === "pending") {
                    statusbadge = `<span>pending</span>`
                }
                else {
                    statusbadge = `<span>yet to start</span>`
                }
                var mytr = document.createElement("tr")
                mytr.innerHTML = `
                <td>${todo.id}</td>
                <td>${todo.title}</td>
                <td>${todo.status}</td>
                <td><button onclick=editask(${index})>Edit task</button></td>
                <td><button onclick=deletetask(${index})>Delete task</button></td>
                `
                document.querySelector("tbody").appendChild(mytr)
            })
        }
        displaytasks()

        function addtask() {
            var newtask = {
                id: document.getElementById("id").value,
                title: document.getElementById("title").value,
                status: document.getElementById("status").value
            }
            Todolist.push(newtask)
            displaytasks()
        }
        function deletetask(index) {
            Todolist.splice(index, 1)
            displaytasks()
        }

        var editindex = null
        function editask(i) {
            editindex = i
            document.getElementById("id").value = Todolist[editindex].id
            document.getElementById("title").value = Todolist[editindex].title
            document.getElementById("status").value = Todolist[editindex].status
            document.getElementById("updatebutton").style.display = "block"
            document.getElementById("addbutton").style.display = "none"
        }
        function updatetask() {
            var newtask = {
                id: document.getElementById("id").value,
                title: document.getElementById("title").value,
                status: document.getElementById("status").value
            }
            Todolist[editindex] = newtask
            displaytasks()
            document.querySelector("form").reset()

            document.getElementById("updatebutton").style.display = "none"
            document.getElementById("addbutton").style.display = "block"
        }



    </script>
</body>

</html>
