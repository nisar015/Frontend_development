<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <table border="1px solid grey">
        <thead>
            <tr>
                <th>Tasks</th>
                <th>Add Task</th>
                <th>Delete Task</th>
                <th>Edit Task</th>
                
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <script>
        var Todolist = [
            {task1:"LearnJavaScript"},
            {task2:"PracticeArrays"},
            {task3:"BuildTodoApp"},
            {task4:"LearnReact"},
        ]
        function displaytasks() {
            Todolist.forEach(function(todo,index){
                var mytr = document.createElement("tr")
                mytr.innerHTML = `
                <td>${todo.task1}</td>
                <td>${todo.task2}</td>
                <td>${todo.task3}</td>
                <td>${todo.task4}</td>
                `
                document.querySelector("tbody").appendChild(mytr)
            })
        }
        displaytasks()
    </script>
</body>

</html>
