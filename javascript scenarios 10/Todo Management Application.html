<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    table{
        width: 80%;
        margin: auto;
    }
    #updatebutton {
        display: none;
    }
</style>

<body>
    <table border="1px solid grey">
        <thead>
            <tr>
                <th>id</th>
                <th>Title</th>
                <!-- <th>Add Task</th> -->
                <th>status</th>
                <th>Edit Task</th>
                <th>Delete Task</th>

            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <br><br>
    <form>
        <label for="id">id</label>
        <input type="id" id="id" name="id">
        <br><br>
        <label for="title">title</label>
        <input type="title" id="title" name="title">
        <br><br>
        <label for="status">status</label>
        <input type="status" id="status" name="status">
        <br><br>
        <button type="button" onclick="addtask()" id="addbutton">add task</button>
        <button type="button" onclick="updatetask()" id="updatebutton">update task</button>
    </form>
    <script>
        var Todolist = [
            {
                id:1,
                title: "LearnJavaScript",
                status: "completed"
            },
            {
                id:2,
                title: "PracticeArrays",
                status: "pending"
            },
            {
                id:3,
                title: "BuildTodoApp",
                status: "Yet to start"
            }
            
        ]
        function displaytasks() {
            document.querySelector("tbody").innerHTML = ""
            Todolist.forEach(function (todo, index) {
                var statusbadge="";
                if(todo.status==="completed"){
                    statusbadge=`<span>completed</span>`
                }
                else if(todo.status==="pending"){
                    statusbadge=`<span>pending</span>`
                }
                else{
                    statusbadge=`<span>yet to start</span>`
                }
                var mytr = document.createElement("tr")
                mytr.innerHTML = `
                <td>${todo.id}</td>
                <td>${todo.title}</td>
                <td>${todo.status}</td>
                <td><button onclick=editask(${index})>Edit task</button></td>
                <td><button onclick=deletetask(${index})>Delete task</button></td>
                `
                document.querySelector("tbody").appendChild(mytr)
            })
        }
        displaytasks()
       
        function addtask() {
            var newtask = {
                id: document.getElementById("id").value,
                title: document.getElementById("title").value,
                status: document.getElementById("status").value
            }
            Todolist.push(newtask)
            displaytasks()
            clearformfields()
        }
        function deletetask(index) {
            Todolist.splice(index, 1)
            displaytasks()
        }
        function clearformfields() {
            document.getElementById("task").value = ""
        }
        var editindex = null
        function editask(i) {
            editindex = i
            document.getElementById("task").value = Todolist[editindex].task
            document.getElementById("updatebutton").style.display = "block"
            document.getElementById("addbutton").style.display = "none"
        }
        function updatetask() {
            var newtask = {
                task: document.getElementById("task").value
            }
            Todolist[editindex] = newtask
            displaytasks()
            clearformfields()
            document.getElementById("updatebutton").style.display = "none"
            document.getElementById("addbutton").style.display = "block"
        }
        function checkcompleted() {
            console.log("completed")
        }
        function checkpending() {
            console.log("pending")
        }
        // how to store marked todos as completed and pending
        // how to display them

    </script>
</body>

</html>
