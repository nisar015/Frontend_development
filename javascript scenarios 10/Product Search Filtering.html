<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        var products = [
            {
                category: "phone",
                prouctname: "iPhone"
            },
            {
                category:"phone",
                prouctname: "Samsung Galaxy",
            },
            {
                category:"phone",
                prouctname: "OnePlus",
            },
            {
                category:"Laptop",
                prouctname: "MacBook",
            },
            {
                category:"Laptop",
                prouctname: "Dell Laptop",
            }
        ]
        function searchbyproname(proname){
            var check= products.filter(function(val){
                return val.category==proname
            })
            var checkagain=products.find(function(ele){
                return ele.prouctname==proname
            })
            // console.log(check)
            if(check){
                return check
            }
            if(checkagain){
                return "Yes product found: ",checkagain.category,checkagain.prouctname
            }
            

        }
        console.log(searchbyproname('phone'))
        console.log(searchbyproname('MacBook'))
    </script>
</body>

</html>
