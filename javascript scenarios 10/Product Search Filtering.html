<head>

</head>

<body>
    <script>
        var products = [
            {
                category: "phone",
                prouctname: "iPhone",
                price:85000
            },
            {
                category:"phone",
                prouctname: "Samsung Galaxy",
                price:45000
            },
            {
                category:"phone",
                prouctname: "OnePlus",
                price:35000
            },
            {
                category:"Laptop",
                prouctname: "MacBook",
                price:95000
            },
            {
                category:"Laptop",
                prouctname: "Dell Laptop",
                price:60000
            }
        ]
        function searchbycategory(cat){
            
            var check= products.filter(function(val){
                return val.category==cat
            })
            // console.log(check)
            if(check){
                return check
            }
            

        }
        function searchbyproname(proname){
            
            var check= products.find(function(val){
                return val.prouctname==proname
            })
            // console.log(check)
            if(check){
                return check
            }
            

        }
        console.log(searchbyproname('phone'))
        console.log(searchbycategory('MacBook'))
        console.log(searchbyproname('MacBook'))
    </script>
</body>
