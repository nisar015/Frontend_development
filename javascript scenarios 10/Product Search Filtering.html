<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    table {
        display: none;
        width: 80%;
        margin: auto;
    }
</style>

<body>
    <table border="1px solid">
        <thead>
            <tr>
                <th>Category</th>
                <th>Product Name</th>
                <th>Product Price</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>
    <h2 id="head2"></h2>
    <search>
        <form>
            <label for="site-search">Search by product name:</label>
            <input type="search" id="search" name="search" placeholder="Type here to search..." required>
        </form>
    </search>
    <button type="button" onclick="searchbyproname()">Search</button><br><br>
    <button type="button" onclick="filterbelowprice()" id="belowprice">Search products below a
        price</button><br><br>
    <button type="button" onclick="filteraboveprice()" id="aboveprice">Search products above a price</button>
    <button type="button" onclick="sortprobyprice()" id="sortbyprice">Sort products</button>

    <script>
        var products = [
            {
                category: "phone",
                prouctname: "iPhone",
                price: 85000
            },
            {
                category: "phone",
                prouctname: "Samsung Galaxy",
                price: 45000
            },
            {
                category: "phone",
                prouctname: "OnePlus",
                price: 35000
            },
            {
                category: "Laptop",
                prouctname: "MacBook",
                price: 95000
            },
            {
                category: "Laptop",
                prouctname: "Dell Laptop",
                price: 60000
            }
        ]
        function displayproducts(){
            document.querySelector("tbody").innerHTML=""
            products.forEach(function(pro){
                var mytd=document.createElement("tr")
                mytd.innerHTML=`
                <td>${pro.category}</td>
                <td>${pro.prouctname}</td>
                <td>${pro.price}</td>
                `
                document.querySelector("tbody").appendChild(mytd)
            })
            document.querySelector("table").style.display="block"
        }
        function searchbycategory(cat) {

            var check = products.filter(function (val) {
                return val.category == cat
            })
            // console.log(check)
            if (check) {
                return check
            }


        }
        function searchbyproname(proname) {
            document.querySelector("tbody").innerHTML=""
            var inputproname = document.getElementById("search").value.toLowerCase()
            // console.log(inputproname);
            var check = products.find(function (val) {
                return val.prouctname.toLowerCase() === inputproname
            })
            if (check) {
                //     document.getElementById("head2").innerHTML =
                //         `Productname : ${check.prouctname} <br> 
                //  Category : ${check.category} <br> 
                //  Price : ${check.price}`;
                var mytd = document.createElement("tr")
                mytd.innerHTML = `
             <td>${check.category}</td>
             <td>${check.prouctname}</td>
             <td>${check.price}</td>
             `
                document.querySelector("tbody").appendChild(mytd)
            } else {
                document.getElementById("head2").innerHTML = "Product not found.";
            }
            
            document.querySelector("table").style.display = "block"
            // console.log(check);
            // document.getElementById("head2").innerHTML = `Productname : ${check.prouctname} <br> Category : ${check.category} <br> Price : ${check.price}`



        }
        function filterbelowprice() {
            // var belowprice = []
            document.querySelector("tbody").innerHTML = ""
            var enterbelowprice=document.getElementById("search").value.toLowerCase()
            products.forEach(function (val) {
                if (val.price < enterbelowprice) {
                    // belowprice.push(val.prouctname)
                    var mytd = document.createElement("tr")
                    mytd.innerHTML = `
                    <td>${val.category}</td>
                    <td>${val.prouctname}</td>
                    <td>${val.price}</td>
                    `
                    document.querySelector("tbody").appendChild(mytd)
                }
            })
            document.querySelector("table").style.display = "block"
            document.querySelector("form").reset()
            // return belowprice
        }

        function filteraboveprice() {
            document.querySelector("tbody").innerHTML = ""
            var enteraboveprice =document.getElementById("search").value.toLowerCase()
            products.forEach(function (val) {
                if (val.price > enteraboveprice) {
                    var mytd = document.createElement("tr")
                    mytd.innerHTML = `
                    <td>${val.category}</td>
                    <td>${val.prouctname}</td>
                    <td>${val.price}</td>
                    `
                    document.querySelector("tbody").appendChild(mytd)
                }
            })
            document.querySelector("table").style.display = "block"
            document.querySelector("form").reset()
            // return aboveprice
        }
        function sortprobyprice(){
            products.sort(function(a,b){
                return a.price-b.price
            })
            displayproducts()
        }
        // console.log(searchbycategory('phone'))
        // console.log(searchbyproname('MacBook'))
        // how to implement case insensitive search
        // console.log(filterbelowprice())
        // console.log(filteraboveprice())
        // how to sort products by price using sort method
    </script>
</body>

</html>
