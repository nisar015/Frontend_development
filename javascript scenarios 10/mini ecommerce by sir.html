<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #Products {
            width: 100%;
            overflow: auto;
        }

        #Products li {
            width: 200px;
            float: left;
            margin: 10px;
        }

        .card img {
            width: 200px;
        }
    </style>
</head>

<body>
    <ul id="Products">

    </ul>
    <script>
        function getallproducts() {
            fetch("http://localhost:3000/Products").then(function (response) {
                return response.json()
            }).then(function (data) {

                console.log(data);
                data.forEach(function (pros) {
                    var myli = document.createElement('li')
                    myli.innerHTML = `
                    <div class="card" style="width:10rem">
                        <img src="${pros.image}" alt="product image">
                        <div class="card-body">
                            <h5>${pros.name}</h5>
                            <p>${pros.description}</p>
                            <h5>${pros.price}</h5>
                            <button onclick=addtocart()>Add to cart</button>
                        </div>
                    </div>
                    `
                    document.getElementById("Products").appendChild(myli)
                })
            })
        }
        getallproducts()
    </script>
</body>

</html>
