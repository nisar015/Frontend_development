<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <ul id="studentmarks">

    </ul>
    <hr>
    <ul id="studentgrades">

    </ul>
    <hr>
    <ul id="sortedstudents">

    </ul>
    <table border="1">
        <thead>
            <tr>
                <th>Student Name</th>
                <th>Student Marks</th>
                <th>Student Grades</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <h2 id="stupass"></h2>
    <button type="button" onclick="grades()">highest marks</button>

    <script>
        var students = [
            { name: "Arun", marks: 85 },
            { name: "Priya", marks: 32 },
            { name: "Kumar", marks: 45 }
        ];
        var studentpassed = []
        var studentFailed = []
        function displaystudentmarks() {

            students.forEach(function (student,i) {

                var mytd = document.createElement("tr");

                mytd.innerHTML = `
            <td>${student.name}</td>
            <td>${student.marks}</td>
            <td>${displaystudentgrades(student.marks)}</td>
        `;

                document.querySelector("tbody").appendChild(mytd);
            });
        }


        function displaystudentgrades(marks) {

            if (marks >= 80) {
                return "Grade A";
            }
            else if (marks >= 70 && marks < 80) {
                return "Grade B";
            }
            else {
                return "Grade C";
            }
        }


        displaystudentmarks();
        
        function grades() {
            var highmarks=students[0].marks
            
            for(var i=1;i<students.length;i++){
                if(highmarks<students[i].marks){
                    highmarks=students[i].marks
                }
                
            }
            document.getElementById("stupass").innerHTML=highmarks
        }
        
        var maxele = students[0].marks
        var maxindex = 0
        for (var i = 1; i < students.length; i++) {
            if (maxele > students[i].marks) {
                maxele = maxele
                maxindex = maxindex
                // var maxstudentname=students[i].name
            }
            else {
                maxele = students[i].marks
                maxindex = i
            }
        }
        console.log("highest marks :", students[maxindex].name, maxele)
        // minindex=0
        for (var i = 1; i < students.length; i++) {
            if (maxele < students[i].marks) {
                maxele = maxele
                maxindex = maxindex
                // var maxstudentname=students[i].name
            }
            else {
                maxele = students[i].marks
                maxindex = i
            }
        }
        console.log("lowest marks :", students[maxindex].name, maxele)
        function average() {
            return students.reduce(function (i, j) {
                return i + j.marks
            }, 0)
        }
        console.log("class average is:", average() / students.length)
        console.log("passed students:", studentpassed)
        console.log("Failed students:", studentFailed)
        function sortstudentbymarks() {
            students.sort(function (a, b) {
                console.log(a, b);
                return a.marks - b.marks
            })
            // console.log(students);
            displaysortedstudents()
        }
        // sortstudentbymarks()
        function displaysortedstudents() {
            students.forEach(function (student) {
                // var myli=document.createElement("li")
                // var studentgrade=null
                var myli = document.createElement("li")
                myli.innerHTML = `
                <li>${student.name} - ${student.marks}</li>

                `
                document.getElementById("sortedstudents").appendChild(myli)
            })

        }
        // how to sort the students by direct sort method
    </script>
</body>

</html>
