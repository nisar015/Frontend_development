<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        var students = [
            { name: "Arun", marks: 85 },
            { name: "Priya", marks: 72 },
            { name: "Kumar", marks: 45 }
        ];
        var studentpassed=[]
        var studentFailed=[]
        students.forEach(function (student) {
            console.log(`${student.name} : ${student.marks}`)
        })
        function grades(name) {
            var check = students.find(function(val){
                return val.name==name
            })
            if(check){
                if(check.marks>80){
                    studentpassed.push({"name":check.name,"marks":check.marks})
                    return `${check.name} : Grade A`
                }
                else if(check.marks>70 & check.marks<80){
                    studentpassed.push({"name":check.name,"marks":check.marks})
                    return `${check.name} : Grade B`
                }
                else{
                    studentFailed.push({"name":check.name,"marks":check.marks})
                    return `${check.name} : Grade F`
                }
            }
        }
        students.forEach(function(stu){
            console.log(grades(stu.name))
        })
        var maxele=students[0].marks
        var maxindex=0
        for(var i=1;i<students.length;i++){
            if(maxele>students[i].marks){
                maxele=maxele
                maxindex=maxindex
                // var maxstudentname=students[i].name
            }
            else{
                maxele=students[i].marks
                maxindex=i
            }
        }
        console.log("highest marks :",students[maxindex].name,maxele)
        // minindex=0
        for(var i=1;i<students.length;i++){
            if(maxele<students[i].marks){
                maxele=maxele
                maxindex=maxindex
                // var maxstudentname=students[i].name
            }
            else{
                maxele=students[i].marks
                maxindex=i
            }
        }
        console.log("lowest marks :",students[maxindex].name,maxele)
        function average(){
            return students.reduce(function(i,j){
                return i + j.marks
            },0)
        }
        console.log("class average is:",average()/students.length)
        console.log("passed students:",studentpassed)
        console.log("Failed students:",studentFailed)
    </script>
</body>

</html>
