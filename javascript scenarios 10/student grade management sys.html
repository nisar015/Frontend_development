<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <ul id="studentmarks">
        
    </ul>
    <hr>
    <ul id="studentgrades">

    </ul>
    <hr>
    <ul id="sortedstudents">

    </ul>
    <table border="1">
        <thead>
            <tr>
                <th>Student Name</th>
                <th>Student Marks</th>
                <th>Student Grades</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    
    
    <script>
        var students = [
            { name: "Arun", marks: 85 },
            { name: "Priya", marks: 72 },
            { name: "Kumar", marks: 45 }
        ];
        var studentpassed=[]
        var studentFailed=[]
        function displaystudentmarks(){
            students.forEach(function (student) {
                // document
                // console.log(`${student.name} : ${student.marks}`)
                var myli=document.createElement("li")
                myli.innerHTML=`
                <li>${student.name} - ${student.marks}</li>

                `
                document.querySelector("ul").appendChild(myli)

                var mytd=document.createElement("tr")
                mytd.innerHTML=`
                <td>${student.name}</td>
                <td>${student.marks}</td>
                `
                document.querySelector("tbody").appendChild(mytd)
            })
            
        }
        displaystudentmarks()
        function displaystudentgrades(){
            students.forEach(function(student){
                var myli=document.createElement("li")
                var studentgrade=null
                if(student.marks>=80){
                    studentgrade="Grade A"
                }
                else if(student.marks>70 & student.marks<80){
                    studentgrade="Grade B"
                }
                else{
                    studentgrade="Grade C"
                }
                myli.innerHTML=`
                <li>${student.name}- ${studentgrade}</li>
                `
                document.getElementById("studentgrades").appendChild(myli)
            })
        }
        displaystudentgrades()
        function grades(name) {
            var check = students.find(function(val){
                return val.name==name
            })
            if(check){
                if(check.marks>80){
                    studentpassed.push({"name":check.name,"marks":check.marks})
                    return `${check.name} : Grade A`
                }
                else if(check.marks>70 & check.marks<80){
                    studentpassed.push({"name":check.name,"marks":check.marks})
                    return `${check.name} : Grade B`
                }
                else{
                    studentFailed.push({"name":check.name,"marks":check.marks})
                    return `${check.name} : Grade F`
                }
            }
        }
        students.forEach(function(stu){
            console.log(grades(stu.name))
        })
        var maxele=students[0].marks
        var maxindex=0
        for(var i=1;i<students.length;i++){
            if(maxele>students[i].marks){
                maxele=maxele
                maxindex=maxindex
                // var maxstudentname=students[i].name
            }
            else{
                maxele=students[i].marks
                maxindex=i
            }
        }
        console.log("highest marks :",students[maxindex].name,maxele)
        // minindex=0
        for(var i=1;i<students.length;i++){
            if(maxele<students[i].marks){
                maxele=maxele
                maxindex=maxindex
                // var maxstudentname=students[i].name
            }
            else{
                maxele=students[i].marks
                maxindex=i
            }
        }
        console.log("lowest marks :",students[maxindex].name,maxele)
        function average(){
            return students.reduce(function(i,j){
                return i + j.marks
            },0)
        }
        console.log("class average is:",average()/students.length)
        console.log("passed students:",studentpassed)
        console.log("Failed students:",studentFailed)
        function sortstudentbymarks(){
            students.sort(function(a,b){
                console.log(a,b);
                return a.marks-b.marks
            })
            // console.log(students);
            displaysortedstudents()
        }
        sortstudentbymarks()
        function displaysortedstudents(){
            students.forEach(function(student){
                // var myli=document.createElement("li")
                // var studentgrade=null
                var myli=document.createElement("li")
                myli.innerHTML=`
                <li>${student.name} - ${student.marks}</li>

                `
                document.getElementById("sortedstudents").appendChild(myli)
            })
            
        }
        // how to sort the students by direct sort method
    </script>
</body>

</html>
