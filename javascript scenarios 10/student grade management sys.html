<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Marks Management</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary shadow">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                🎓 Student Marks Management
            </span>
        </div>
    </nav>


    <div class="container py-5">

        <!-- Heading -->
        <div class="text-center mb-4">

            <h1 class="fw-bold text-primary">
                Student Performance
            </h1>

            <p class="text-muted">
                View marks, grades and analyze student performance
            </p>

        </div>


        <!-- Student Table -->
        <div class="card shadow-sm border-0 mb-4">

            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">
                    📊 Student Details
                </h5>
            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-bordered table-hover align-middle text-center mb-0">

                        <thead class="table-dark">

                            <tr>
                                <th>Student Name</th>
                                <th>Student Marks</th>
                                <th>Student Grades</th>
                            </tr>

                        </thead>

                        <tbody>
                        </tbody>

                    </table>

                </div>

            </div>

        </div>


        <!-- Highest / Lowest / Average -->
        <div class="row g-3 mb-4">

            <!-- Result -->
            <div class="col-md-4">

                <div class="card shadow-sm border-0 h-100">

                    <div class="card-body text-center">

                        <h6 class="text-muted">
                            Result
                        </h6>

                        <h4 id="stupass" class="text-primary mt-3">
                        </h4>

                    </div>

                </div>

            </div>


            <!-- Failed Students -->
            <div class="col-md-4">

                <div class="card shadow-sm border-0 h-100">

                    <div class="card-header bg-danger text-white">

                        <h5 class="mb-0">
                            ❌ Failed Students
                        </h5>

                    </div>

                    <div class="card-body">

                        <ul id="stufail" class="list-group">
                        </ul>

                    </div>

                </div>

            </div>


            <!-- Passed Students -->
            <div class="col-md-4">

                <div class="card shadow-sm border-0 h-100">

                    <div class="card-header bg-success text-white">

                        <h5 class="mb-0">
                            ✅ Passed Students
                        </h5>

                    </div>

                    <div class="card-body">

                        <ul id="stupass2" class="list-group">
                        </ul>

                    </div>

                </div>

            </div>

        </div>


        <!-- Buttons -->
        <div class="card shadow-sm border-0">

            <div class="card-header bg-dark text-white">

                <h5 class="mb-0">
                    Student Analysis
                </h5>

            </div>


            <div class="card-body">

                <div class="row g-2">

                    <!-- Highest -->
                    <div class="col-md-3 col-sm-6">

                        <button
                            type="button"
                            onclick="highestmark()"
                            class="btn btn-success w-100">

                            🏆 Highest Marks

                        </button>

                    </div>


                    <!-- Lowest -->
                    <div class="col-md-3 col-sm-6">

                        <button
                            type="button"
                            onclick="lowestmarks()"
                            class="btn btn-danger w-100">

                            📉 Lowest Marks

                        </button>

                    </div>


                    <!-- Average -->
                    <div class="col-md-3 col-sm-6">

                        <button
                            type="button"
                            onclick="classavg()"
                            class="btn btn-primary w-100">

                            📈 Class Average

                        </button>

                    </div>


                    <!-- Sort -->
                    <div class="col-md-3 col-sm-6">

                        <button
                            type="button"
                            onclick="sortstudentbymarks()"
                            class="btn btn-warning w-100">

                            🔃 Sort By Marks

                        </button>

                    </div>


                    <!-- Pass Fail -->
                    <div class="col-md-4 col-sm-6 mx-auto mt-3">

                        <button
                            type="button"
                            onclick="studentsPassFail()"
                            class="btn btn-info text-white w-100">

                            ✅ Pass & Fail

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <script>

        // Student data

        var students = [

            { name: "Arun", marks: 85 },

            { name: "Priya", marks: 32 },

            { name: "Kumar", marks: 45 }

        ];


        var studentpassed = []

        var studentFailed = []


        // Display students in table

        function displaystudentmarks() {

            document.querySelector("tbody").innerHTML = ""

            students.forEach(function (student, i) {

                var mytd = document.createElement("tr");

                mytd.innerHTML = `

                    <td class="fw-semibold">
                        ${student.name}
                    </td>

                    <td>
                        ${student.marks}
                    </td>

                    <td>
                        ${displaystudentgrades(student.marks)}
                    </td>

                `;

                document
                    .querySelector("tbody")
                    .appendChild(mytd);

            });

        }


        // Display grade

        function displaystudentgrades(marks) {

            if (marks >= 80) {

                return "Grade A";

            }

            else if (marks >= 70 && marks < 80) {

                return "Grade B";

            }

            else {

                return "Grade C";

            }

        }


        // Display students when page loads

        displaystudentmarks();


        // Find highest marks

        function highestmark() {

            var highmarks = students[0]

            for (var i = 1; i < students.length; i++) {

                if (highmarks.marks < students[i].marks) {

                    highmarks = students[i]

                }

            }

            document.getElementById("stupass").innerHTML =
                `${highmarks.name} : ${highmarks.marks}`

        }


        // Find lowest marks

        function lowestmarks() {

            var lowestmark = students[0]

            for (var i = 1; i < students.length; i++) {

                if (lowestmark.marks > students[i].marks) {

                    lowestmark = students[i]

                }

            }

            document.getElementById("stupass").innerHTML =
                `${lowestmark.name} : ${lowestmark.marks}`

        }


        // Calculate class average

        function classavg() {

            var avg = students.reduce(function (i, j) {

                return i + j.marks

            }, 0)

            document.getElementById("stupass").innerHTML =
                avg / students.length

        }


        // Display Pass and Fail students

        function studentsPassFail() {

            // Clear previous results

            document.getElementById("stufail").innerHTML = ""

            document.getElementById("stupass2").innerHTML = ""


            // Check every student

            students.forEach(function (stu) {

                // Failed student

                if (stu.marks <= 35) {

                    document.getElementById("stufail").innerHTML += `

                        <li class="list-group-item
                                   d-flex
                                   justify-content-between
                                   align-items-center">

                            <span>
                                ${stu.name}
                            </span>

                            <span class="badge bg-danger">
                                ${stu.marks}
                            </span>

                        </li>

                    `

                }


                // Passed student

                else {

                    document.getElementById("stupass2").innerHTML += `

                        <li class="list-group-item
                                   d-flex
                                   justify-content-between
                                   align-items-center">

                            <span>
                                ${stu.name}
                            </span>

                            <span class="badge bg-success">
                                ${stu.marks}
                            </span>

                        </li>

                    `
                }

            })

        }


        // Sort students by marks

        function sortstudentbymarks() {

            students.sort(function (a, b) {

                console.log(a, b);

                return a.marks - b.marks

            })

            displaystudentmarks()

        }

    </script>

</body>

</html>
