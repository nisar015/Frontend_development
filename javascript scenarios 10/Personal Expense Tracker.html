<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    table{
        width: 80%;
        margin: auto;
    }
    button{
        margin: 10px 20px;
    }
    
</style>
<body>
    <table border="1px solid">
        <thead>
            <tr>
                <th>Category</th>
                <th>Expense</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>
    <br><br>
    <form>
        <label for="category">category</label>
        <input type="category" name="category" id="category">
        <br><br>
        <label for="expense">expense</label>
        <input type="expense" name="expense" id="expense">
        <br><br>
        <button type="button" onclick="addexpense()" id="add">add</button>
    </form>
    <script>
        var expenses = [
            {
                category: "Food",
                expense: 500
            },
            {
                category: "Travel",
                expense: 300
            },
            {
                category: "Shopping",
                expense: 1000
            },
            {
                category: "Travel",
                expense: 400
            },
            {
                category: "Entertainment",
                expense: 500
            }
        ]
        function displayexpenses() {
            document.querySelector("tbody").innerHTML=""
            expenses.forEach(function (val,i) {
                var mytr = document.createElement("tr")
                mytr.innerHTML = `
                <td>${val.category}</td>
                <td>${val.expense}</td>
                <td><button onclick=handledit()>edit expense</button></td>
                <td><button onclick=handledelete(${i})>delete expense</button></td>
                `
                document.querySelector("tbody").appendChild(mytr)
            })
        }
        displayexpenses()
        function addexpense() {
            // expenses.push({ category: cat, expense: ex })
            // return expenses
            var expense={
                category:document.getElementById("category").value,
                expense:document.getElementById("expense").value,
            }
            expenses.push(expense)
            displayexpenses()
            document.querySelector("form").reset()
            document.querySelector("form").style.display="none"



        }
        
        function handledelete(index) {
            expenses.splice(index, 1)
            displayexpenses()
        }
        function calculatetotexpense() {
            return expenses.reduce(function (a, b) {
                return a + b.expense
            }, 0)
        }
        function calculatecatexpense(cat) {
            // why filter is returning
            var check = expenses.filter(function (val) {
                return val.category == cat
            })
            // console.log(check)
            if (check) {
                var totexpense = check.reduce(function (a, b) {
                    return a + b.expense
                }, 0)
            }
            return `total ${cat} expense ${totexpense}`
        }
        function highestexpense() {
            var inex = expenses[0].expense
            for (var i = 1; i < expenses.length; i++) {
                if (inex > expenses[i].expense) {
                    inex = inex
                }
                else {
                    inex = expenses[i].expense
                }
            }
            return inex

        }
        // console.log(inex)
        function lowestexpense() {
            var outex = expenses[0].expense
            // console.log(outex)
            for (var i = 1; i < expenses.length; i++) {
                if (outex > expenses[i].expense) {
                    outex = expenses[i].expense
                }
                else {
                    outex = outex
                }
            }
            return outex

        }
        function avgexpense() {
            return expenses.reduce(function (a, b) {
                return a + b.expense
            }, 0)
        }
        // console.log(addexpense('stay', 2000))

        // console.log(lowestexpense())
        // console.log("average expense:", avgexpense() / expenses.length)
    </script>



</body>

</html>
