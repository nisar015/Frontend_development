    <script>
        var expenses = [
            {
                category: "Food",
                expense: 500

            {

            },
            {

            },
            {

                expense: 500
            }
        ]
        function addexpense(cat, ex) {
            expenses.push({ category: cat, expense: ex })
            return expenses
        }
        function deletexpense(index) {
            expenses.splice(index, 1)
            return expenses
        }
        function calculatetotexpense() {
            return expenses.reduce(function (a, b) {
                return a + b.expense
            }, 0)
        }
        function calculatecatexpense(cat) {
            // why filter is returning
            var check = expenses.filter(function (val) {
                return val.category == cat
            })
            // console.log(check)
            if (check) {
                var totexpense= check.reduce(function (a,b) {
                    return a+b.expense
                }, 0)
            }
            return `total ${cat} expense ${totexpense}`
        }
