```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>


    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <style>

        body {
            background-color: #f5f7fb;
        }

        .navbar-brand {
            font-weight: bold;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .summary-card {
            border-radius: 15px;
            min-height: 130px;
        }

        .summary-title {
            font-size: 14px;
            color: #6c757d;
        }

        .summary-value {
            font-size: 25px;
            font-weight: bold;
        }

        .table th {
            white-space: nowrap;
        }

        .btn {
            border-radius: 8px;
        }

        .form-control,
        .form-select {
            border-radius: 8px;
        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-dark bg-dark mb-4">

        <div class="container">

            <a class="navbar-brand" href="#">
                💰 Expense Tracker
            </a>

        </div>

    </nav>



    <div class="container">


        <!-- ================= HEADING ================= -->

        <div class="text-center mb-4">

            <h2 class="fw-bold">
                Expense Tracker
            </h2>

            <p class="text-muted">
                Track and manage your daily expenses
            </p>

        </div>



        <!-- ================= SUMMARY ================= -->

        <div class="row g-3 mb-4">


            <!-- Total -->

            <div class="col-md-3">

                <div class="card summary-card p-3">

                    <div class="summary-title">
                        Total Expense
                    </div>

                    <div
                        class="summary-value text-primary"
                        id="totalExpense">

                        ₹0

                    </div>

                </div>

            </div>



            <!-- Highest -->

            <div class="col-md-3">

                <div class="card summary-card p-3">

                    <div class="summary-title">
                        Highest Expense
                    </div>

                    <div
                        class="summary-value text-danger"
                        id="highestExpense">

                        ₹0

                    </div>

                </div>

            </div>



            <!-- Lowest -->

            <div class="col-md-3">

                <div class="card summary-card p-3">

                    <div class="summary-title">
                        Lowest Expense
                    </div>

                    <div
                        class="summary-value text-success"
                        id="lowestExpense">

                        ₹0

                    </div>

                </div>

            </div>



            <!-- Average -->

            <div class="col-md-3">

                <div class="card summary-card p-3">

                    <div class="summary-title">
                        Average Expense
                    </div>

                    <div
                        class="summary-value text-warning"
                        id="averageExpense">

                        ₹0

                    </div>

                </div>

            </div>

        </div>



        <!-- ================= MAIN CONTENT ================= -->

        <div class="row g-4">


            <!-- ================= TABLE ================= -->

            <div class="col-lg-8">

                <div class="card p-4">

                    <div
                        class="d-flex justify-content-between align-items-center mb-3">

                        <h4 class="mb-0">
                            Expense List
                        </h4>

                        <!-- <button
                            class="btn btn-success"
                            onclick="showform()">

                            ➕ Add Expense

                        </button> -->

                    </div>


                    <div class="table-responsive">

                        <table
                            class="table table-hover align-middle text-center">


                            <thead class="table-dark">

                                <tr>

                                    <th>
                                        #
                                    </th>

                                    <th>
                                        Category
                                    </th>

                                    <th>
                                        Expense
                                    </th>

                                    <th>
                                        Edit
                                    </th>

                                    <th>
                                        Delete
                                    </th>

                                </tr>

                            </thead>


                            <tbody>
                            </tbody>


                        </table>

                    </div>

                </div>

            </div>



            <!-- ================= FORM ================= -->

            <div class="col-lg-4">

                <div
                    class="card p-4"
                    id="expenseFormCard">


                    <h4 class="mb-4">
                        Add Expense
                    </h4>


                    <form id="expenseForm">


                        <!-- Category -->

                        <div class="mb-3">

                            <label
                                for="category"
                                class="form-label">

                                Category

                            </label>

                            <select
                                id="category"
                                class="form-select">

                                <option value="">
                                    Select Category
                                </option>

                                <option value="Food">
                                    Food
                                </option>

                                <option value="Travel">
                                    Travel
                                </option>

                                <option value="Shopping">
                                    Shopping
                                </option>

                                <option value="Entertainment">
                                    Entertainment
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>



                        <!-- Expense -->

                        <div class="mb-3">

                            <label
                                for="expense"
                                class="form-label">

                                Expense Amount

                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="expense"
                                placeholder="Enter amount">


                        </div>



                        <!-- Buttons -->

                        <div class="d-grid gap-2">


                            <button
                                type="button"
                                class="btn btn-success"
                                id="add"
                                onclick="addexpense()">

                                ➕ Add Expense

                            </button>


                            <button
                                type="button"
                                class="btn btn-primary"
                                id="update"
                                onclick="updateexpense()"
                                style="display:none;">

                                ✏️ Update Expense

                            </button>


                            <!-- <button
                                type="button"
                                class="btn btn-secondary"
                                onclick="hideform()">

                                Cancel

                            </button> -->

                        </div>


                    </form>

                </div>

            </div>

        </div>



        <!-- ================= CATEGORY SEARCH ================= -->

        <div class="card p-4 mt-4">

            <h4>
                Category Expense
            </h4>

            <div class="row g-3 mt-1">

                <div class="col-md-8">

                    <select
                        class="form-select"
                        id="categorySearch">

                        <option value="">
                            Select Category
                        </option>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Travel">
                            Travel
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Entertainment">
                            Entertainment
                        </option>

                    </select>

                </div>


                <div class="col-md-4">

                    <button
                        class="btn btn-dark w-100"
                        onclick="showCategoryExpense()">

                        Calculate

                    </button>

                </div>

            </div>


            <h5
                class="mt-3"
                id="heading">

            </h5>

        </div>


    </div>



    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>



    <script>


        // =========================================
        // EXPENSE DATA
        // =========================================

        var expenses = [

            {
                category: "Food",
                expense: 500
            },

            {
                category: "Travel",
                expense: 300
            },

            {
                category: "Shopping",
                expense: 1000
            },

            {
                category: "Travel",
                expense: 400
            },

            {
                category: "Entertainment",
                expense: 500
            }

        ];



        // =========================================
        // EDIT INDEX
        // =========================================

        var editindex = null;



        // =========================================
        // DISPLAY EXPENSES
        // =========================================

        function displayexpenses() {


            document.querySelector("tbody").innerHTML = "";


            expenses.forEach(function (val, i) {


                var mytr =
                    document.createElement("tr");


                mytr.innerHTML = `

                    <td>
                        ${i + 1}
                    </td>

                    <td>

                        <span class="badge text-bg-primary">

                            ${val.category}

                        </span>

                    </td>

                    <td>

                        <strong>
                            ₹${Number(val.expense).toFixed(2)}
                        </strong>

                    </td>

                    <td>

                        <button
                            class="btn btn-sm btn-warning"
                            onclick="handledit(${i})">

                            ✏️ Edit

                        </button>

                    </td>

                    <td>

                        <button
                            class="btn btn-sm btn-danger"
                            onclick="handledelete(${i})">

                            🗑 Delete

                        </button>

                    </td>

                `;


                document
                    .querySelector("tbody")
                    .appendChild(mytr);

            });


            updateSummary();

        }



        displayexpenses();



        // =========================================
        // ADD EXPENSE
        // =========================================

        function addexpense() {


            var category =
                document.getElementById("category").value;


            var expense =
                document.getElementById("expense").value;


            if (category === "" || expense === "") {

                alert("Please enter category and expense");

                return;

            }


            var newexpense = {

                category: category,

                expense: Number(expense)

            };


            expenses.push(newexpense);


            displayexpenses();


            document
                .getElementById("expenseForm")
                .reset();


            // hideform();

        }



        // =========================================
        // EDIT EXPENSE
        // =========================================

        function handledit(index) {


            editindex = index;


            document.getElementById("category").value =
                expenses[index].category;


            document.getElementById("expense").value =
                expenses[index].expense;


            document.getElementById("add").style.display =
                "none";


            document.getElementById("update").style.display =
                "block";


            document.getElementById("expenseFormCard")
                .scrollIntoView({
                    behavior: "smooth"
                });

        }



        // =========================================
        // UPDATE EXPENSE
        // =========================================

        function updateexpense() {


            var category =
                document.getElementById("category").value;


            var expense =
                document.getElementById("expense").value;


            if (category === "" || expense === "") {

                alert("Please enter category and expense");

                return;

            }


            expenses[editindex] = {

                category: category,

                expense: Number(expense)

            };


            editindex = null;


            displayexpenses();


            document
                .getElementById("expenseForm")
                .reset();


            document.getElementById("add").style.display =
                "block";


            document.getElementById("update").style.display =
                "none";


            // hideform();

        }



        // =========================================
        // DELETE EXPENSE
        // =========================================

        function handledelete(index) {


            expenses.splice(index, 1);


            displayexpenses();

        }



        // =========================================
        // TOTAL EXPENSE
        // =========================================

        var totexpense = 0;


        function calculatetotexpense() {


            totexpense = 0;


            expenses.forEach(function (val) {

                totexpense +=
                    Number(val.expense);

            });


            return totexpense;

        }



        // =========================================
        // CATEGORY EXPENSE
        // =========================================

        function calculatecatexpense(cat) {


            var check =
                expenses.filter(function (val) {

                    return val.category == cat;

                });


            var categoryTotal =
                check.reduce(function (a, b) {

                    return a +
                        Number(b.expense);

                }, 0);


            return categoryTotal;

        }



        // =========================================
        // HIGHEST EXPENSE
        // =========================================

        function highestexpense() {


            if (expenses.length === 0) {
                return 0;
            }


            var inex =
                Number(expenses[0].expense);


            for (
                var i = 1;
                i < expenses.length;
                i++
            ) {


                if (
                    Number(expenses[i].expense)
                    > inex
                ) {

                    inex =
                        Number(expenses[i].expense);

                }

            }


            return inex;

        }



        // =========================================
        // LOWEST EXPENSE
        // =========================================

        function lowestexpense() {


            if (expenses.length === 0) {
                return 0;
            }


            var outex =
                Number(expenses[0].expense);


            for (
                var i = 1;
                i < expenses.length;
                i++
            ) {


                if (
                    Number(expenses[i].expense)
                    < outex
                ) {

                    outex =
                        Number(expenses[i].expense);

                }

            }


            return outex;

        }



        // =========================================
        // AVERAGE EXPENSE
        // =========================================

        function avgexpense() {


            if (expenses.length === 0) {
                return 0;
            }


            return calculatetotexpense()
                / expenses.length;

        }



        // =========================================
        // UPDATE DASHBOARD
        // =========================================

        function updateSummary() {


            document.getElementById("totalExpense")
                .innerHTML =
                "₹" +
                calculatetotexpense().toFixed(2);


            document.getElementById("highestExpense")
                .innerHTML =
                "₹" +
                highestexpense().toFixed(2);


            document.getElementById("lowestExpense")
                .innerHTML =
                "₹" +
                lowestexpense().toFixed(2);


            document.getElementById("averageExpense")
                .innerHTML =
                "₹" +
                avgexpense().toFixed(2);

        }



        // =========================================
        // CATEGORY BUTTON
        // =========================================

        function showCategoryExpense() {


            var category =
                document.getElementById("categorySearch")
                    .value;


            if (category === "") {

                document.getElementById("heading")
                    .innerHTML =
                    "Please select a category.";

                return;

            }


            var total =
                calculatecatexpense(category);


            document.getElementById("heading")
                .innerHTML =
                `Total ${category} expense:
                 <strong>₹${total}</strong>`;

        }



        // =========================================
        // SHOW FORM
        // =========================================

        function showform() {

            document.getElementById("expenseFormCard")
                .style.display = "block";

        }



        // =========================================
        // HIDE FORM
        // =========================================

        function hideform() {

            document.getElementById("expenseFormCard")
                .style.display = "none";

        }


    </script>


</body>

</html>
```
