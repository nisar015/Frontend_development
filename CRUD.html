<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    table{
        width: 600px;
        height: 600px;
        margin: auto;
    }
</style>
<body>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Student Name</th>
                <th>Age</th>
                <th>course</th>
                <th>Marks</th>
                <th>Delete</th>
            </tr>
        </thead>
        <tbody></tbody>
        <!-- <tbody>
            <tr>
                <td></td>
            </tr>
        </tbody> -->
    </table>
    <script>
        var students = [
            {
                id: 101,
                name: "Rahul",
                age: 20,
                course: "JavaScript",
                marks: 85
            },
            {
                id: 102,
                name: "Priya",
                age: 21,
                course: "Python",
                marks: 92
            },
            {
                id: 103,
                name: "Arjun",
                age: 19,
                course: "Java",
                marks: 78
            },
            {
                id: 104,
                name: "Sneha",
                age: 20,
                course: "React",
                marks: 88
            },
            {
                id: 105,
                name: "Kiran",
                age: 22,
                course: "SQL",
                marks: 75
            }
        ];
        function displaystudents(){
            document.querySelector("tbody").innerHTML=""
            students.forEach(function(student,i){
                var mytr=document.createElement("tr")
                mytr.innerHTML=`
                <td>${student.id}</td>
                <td>${student.name}</td>
                <td>${student.age}</td>
                <td>${student.course}</td>
                <td>${student.marks}</td>
                <td><button onclick=handledelete(${i})>Delete User</button></td>
                    `
                document.querySelector("tbody").appendChild(mytr)
                // console.log(i)
            })
        }
        displaystudents()
        function handledelete(i){
            students.splice(i,1)
            console.log("deleted : ",students[i])
            displaystudents()
        }
    </script>
</body>

</html>
