<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        background: lightslategrey;
    }
    table {
        width: 600px;
        height: 600px;
        margin: auto;
    }
    #updatebutton{
        display: none;
    }
</style>

<body>
    <table border="1px solid grey">
        <thead>
            <tr>
                <th>ID</th>
                <th>Student Name</th>
                <th>Age</th>
                <th>course</th>
                <th>Marks</th>
                <th>Delete</th>
                <th>Edit</th>
            </tr>
        </thead>
        <tbody></tbody>
        <!-- <tbody>
            <tr>
                <td></td>
            </tr>
        </tbody> -->
    </table>
    <form>

        <!-- Text -->
        <label for="ID">Id :</label>
        <input type="id" id="id" name="id">
        <br><br>

        <!-- Email -->
        <label for="name">name</label>
        <input type="name" id="name" name="name" username="username" autocomplete="username">
        <br><br>

        <!-- Password -->
        <label for="age">age</label>
        <input type="age" id="age" name="age" autocomplete="current-password">
        <br><br>

        <!-- Telephone -->
        <label for="course">course</label>
        <input type="course" id="course" name="course">
        <br><br>

        <!-- Number -->
        <label for="marks">marks</label>
        <input type="marks" id="marks" name="marks" min="18" max="60">
        <br><br>

        <button type="button" onclick="addstudent()" id="addbutton">addstudent</button>
        <button type="button" onclick="updatestudent()" id="updatebutton">update</button>
    </form>
    <script>
        var students = [
            {
                id: 101,
                name: "Rahul",
                age: 20,
                course: "JavaScript",
                marks: 85
            },
            {
                id: 102,
                name: "Priya",
                age: 21,
                course: "Python",
                marks: 92
            },
            {
                id: 103,
                name: "Arjun",
                age: 19,
                course: "Java",
                marks: 78
            },
            {
                id: 104,
                name: "Sneha",
                age: 20,
                course: "React",
                marks: 88
            },
            {
                id: 105,
                name: "Kiran",
                age: 22,
                course: "SQL",
                marks: 75
            }
        ];
        function displaystudents(){
            students.forEach(function(student){
                // console.log(student)
                var mytr=document.createElement("tr")
                // console.log(mytr)
                mytr.innerHTML=`
                <td>${student.id}</td>
                <td>${student.name}</td>
                <td>${student.age}</td>
                <td>${student.course}</td>
                <td>${student.marks}</td>
                <button onclick="handledelete()">delete</button>

                `
                document.querySelector("tbody").appendChild(mytr)
            })
        }
        displaystudents()
        

    </script>
</body>

</html>
