<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        console.log("for loop")
        for(var i=0;i<=5;i++){
            console.log(i);
        }
        console.log("while loop")
        var j=0;
        while(j<=6){
            console.log(j)
            j++;
        }
        console.log("do while loop")
        var k=0;
        do{
            console.log(k)
        }while(k<=5)
        console.log("for..of loop")
        var nums=[1,25,4,3,42]
        for(var num of nums){
            console.log(num)
        }
    </script>
</body>
</html>
