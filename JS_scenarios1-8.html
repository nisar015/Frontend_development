    <script>
        // 1.Student Grade Calculator 
        student=[
        { name: "Arun", marks: 85 },
        { name: "Priya", marks: 72 },
        { name: "Kumar", marks: 45 }
        ];
        function calculateGrade(marks){
            if (marks>=90){
                return "A+";
            }
            else if(marks>=80){
                return "A";
            }
            else if(marks>=70){
                return "B";
            }
            else if (marks>=60){
                return "C";
            }
            else if(marks>=50){
                return "D";
            }
            else{
                return "False";
            }
        }
        for(var stu of student){
            var grade=calculateGrade(stu.marks)
            console.log(stu.name,stu.marks)
        }

    </script>
