<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>object</title>
</head>

<body>
    <div style="width: 444PX;
    HEIGHT: 150PX;
    margin: 0 AUTO;">
        <p style="font-family: sans-serif;
    font-size: 55PX;">OPEN CONSOLE</p>
    </div>
    <script>
        // 15. Recipe Generator
        var recipegenerator = {
            ingredients: ["milk", "ghee", "sugar"],
            recipes: ["name", "prepTime", "servings", "steps"],
            popularIngredients: ["i1", "i2", "i3..."],
            dietaryPreferences: null,
            generateRecipe: function (preferences) { }
        }

        // accessing objs
        console.log(recipegenerator.ingredients);
        console.log(recipegenerator["ingredients"]);
        var key = "recipes";
        console.log(recipegenerator[key])
        console.log(recipegenerator.ingredients);

        // add,update and delete
        recipegenerator.dietaryPreferences = "sweets";
        recipegenerator["cookingtimeneeded"] = "45min";
        delete recipegenerator.generateRecipe

        // looping through objs
        for (y in recipegenerator) {
            console.log(recipegenerator[y]);
        }
        for (key in recipegenerator) {
            console.log(key, ":", recipegenerator[key])
        }

        // builtin methods
        console.log(Object.keys(recipegenerator));
        console.log(Object.values(recipegenerator));
        console.log(Object.entries(recipegenerator));
        console.log(Object.freeze(recipegenerator));
        console.log(recipegenerator);

        // shorthand props
        var user = "users";
        var id = 24;
        var objs = {
            user,
            id
        };
        console.log(user);
        console.log(id)

        // destructuring
        var { ingredient, dietaryPreferences } = recipegenerator;
        console.log(ingredient);
        console.log(dietaryPreferences);

        // spread ops with objs
        var user1 = {
            user: "name",
            ids: 45
        };
        var user2 = {
            username: "numa",
            id: 33333
        };
        var newusers = { ...user1, ...user2 };
        console.log(newusers)

        // checking props existence
        console.log(recipegenerator.hasOwnProperty("recipes"));
        console.log(recipegenerator.name == undefined)
        // function Student(name,age){
        //     this.name;
        //     this.age;
        // }
        class Student {
            constructor(name, age, surname) {
                this.name;
                this.age;
                this.surname
            }
        }
        var student1 = new Student("nisar", 24, "acc")
        console.log(student1);

    </script>
</body>

</html>
